---
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^badges/
      - id: check-yaml
        exclude: ^helm/
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
        exclude: ^helm/

  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: >-
          bash -c
          'npx --yes markdownlint-cli@0.44.0
          "**/*.md"
          --ignore
          "**/node_modules/**"
          --fix'
        language: system
        pass_filenames: false
      - id: no-push-to-main
        name: Block direct pushes to main
        entry: >-
          bash -c
          'branch=$(git symbolic-ref --short HEAD 2>/dev/null);
          if [ "$branch" = "main" ]; then
          echo "ERROR: Direct push to main is not allowed.";
          echo "Create a feature branch and open a pull request.";
          exit 1;
          fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: quality-gate
        name: Run required local quality gate
        entry: make quality-gate
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-dependency-audit
        name: frontend dependency audit (moderate and above)
        entry: >-
          node scripts/frontend-audit-check.mjs
          --root .
          --workspace-dir frontend
          --audit-level moderate
        language: system
        files: frontend/bun\.lock
        pass_filenames: false
      # The backend has its own bun.lock and was audited by nothing. `files:`
      # scopes each hook to the lockfile it reads, so a backend-only change
      # does not pay for a frontend audit and vice versa -- but a change to
      # either one is now audited, which is the property that was missing.
      - id: backend-dependency-audit
        name: backend dependency audit (moderate and above)
        entry: >-
          node scripts/frontend-audit-check.mjs
          --root .
          --workspace-dir backend
          --audit-level moderate
        language: system
        files: backend/bun\.lock
        pass_filenames: false
      - id: bun-lockfile-check
        name: bun lockfile integrity
        entry: >-
          node scripts/bun-lockfile-check.mjs
          frontend/bun.lock
          backend/bun.lock
        language: system
        files: ^(frontend|backend)/bun\.lock$
        pass_filenames: false
