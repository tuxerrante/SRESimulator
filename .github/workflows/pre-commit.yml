---
name: Pre-commit Checks

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Ensure SHA-pinned actions
        # v5.0.3
        uses: >-
          zgosalvez/github-actions-ensure-sha-pinned-actions@c4e71056006d29f90204b2d063be337109507d62

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pre-commit

      - name: Install dependencies
        run: make install

      - name: Run pre-commit hooks
        run: make pre-commit
