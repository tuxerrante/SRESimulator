---
name: Pre-commit Checks

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load npm version
        run: echo "NPM_VERSION=$(tr -d '\n' < .npm-version)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Update npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Ensure SHA-pinned actions
        # v5.0.3
        uses: >-
          zgosalvez/github-actions-ensure-sha-pinned-actions@c5fc58bd0be7a4b94b73ce40250322d5b838a108

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pre-commit

      - name: Install dependencies
        run: make install

      - name: Run pre-commit hooks
        run: make pre-commit
