---
name: Pre-commit Checks

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.18.0
        uses: >-
          step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Load npm version
        run: echo "NPM_VERSION=$(tr -d '\n' < .npm-version)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Update npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Ensure SHA-pinned actions
        # v5.0.3
        uses: >-
          zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pre-commit

      - name: Install dependencies
        run: make install

      - name: Run pre-commit hooks
        run: make pre-commit
