---
name: Dependabot E2E Build

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependabot-e2e-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-images:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Harden runner
        # v2.18.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout Dependabot head without credentials
        # v6.0.2
        uses: >-
          actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build unprivileged PR image artifact
        # v7.3.0
        uses: >-
          docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: >-
            ghcr.io/${{ github.repository_owner }}/sre-simulator-${{
              matrix.component
            }}:${{
              github.event.pull_request.head.sha
            }}
          # The default buildx "docker" driver cannot export to a tarball, so
          # load the image into the local daemon and save it separately
          # instead of using outputs: type=docker,dest=...
          load: true

      - name: Export image artifact
        env:
          COMPONENT: ${{ matrix.component }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          image+="/sre-simulator-${COMPONENT}:${HEAD_SHA}"
          docker save "${image}" --output "${RUNNER_TEMP}/${COMPONENT}.tar"

      - name: Record artifact identity
        env:
          COMPONENT: ${{ matrix.component }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/artifact"
          mkdir -p "${artifact_dir}"
          mv "${RUNNER_TEMP}/${COMPONENT}.tar" "${artifact_dir}/image.tar"
          (
            cd "${artifact_dir}"
            sha256sum image.tar > image.tar.sha256
          )
          jq -n \
            --arg component "${COMPONENT}" \
            --arg head_sha "${HEAD_SHA}" \
            '{component: $component, head_sha: $head_sha}' \
            > "${artifact_dir}/metadata.json"

      - name: Upload immutable image artifact
        # v4.6.2
        uses: >-
          actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            dependabot-e2e-${{ matrix.component }}-${{
              github.event.pull_request.head.sha
            }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 1
