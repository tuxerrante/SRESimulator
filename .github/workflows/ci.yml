---
name: CI

"on":
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  direct-push-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Flag direct push to main
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "::warning::Direct push to main detected — use a PR instead."
          echo "Pushed by: ${ACTOR} (${SHA})"

  tag-mainline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # v6.3.0
        uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Verify semver tag ancestry
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "Not a push event; skipping tag ancestry check."
            exit 0
          fi
          if [[ ! "${REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semver tag push; skipping tag ancestry check."
            exit 0
          fi

          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${SHA}" "origin/main"; then
            echo "Tag ${REF} points to ${SHA}, outside main history."
            echo "Release tags must be created from main."
            exit 1
          fi
          echo "Tag commit is on main history."

      - name: Verify semver surfaces for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-version-sync.mjs verify --tag "${RELEASE_TAG}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      run_integration: ${{ steps.detect.outputs.run_integration }}
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
          fi

          # Fall back to running integration if diff endpoints are unavailable.
          if [[ -z "${base_sha}" ]] || [[ "${base_sha}" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Unable to determine diff base; running integration and E2E." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Use merge-base diff for PRs to ignore unrelated base-only commits.
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}...${head_sha}"
            )
          else
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}" "${head_sha}"
            )
          fi

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running integration and E2E." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # docs_only skips the (cheap) integration suites. e2e_exempt also
          # skips the expensive, manually-approved live-e2e cluster gate. Both
          # are strict positive allowlists: any file outside the allowlist
          # forces the corresponding suite to run (fail-safe default). The e2e
          # allowlist is a superset of docs (it additionally permits inert
          # repo-meta files such as .gitignore) because those can never affect
          # runtime, build, or deploy behavior and so cannot change an E2E
          # outcome. Anything that can — source, .github/**, scripts/**,
          # helm/**, infra/**, Dockerfiles, package/lock files, Makefile — is
          # unlisted and therefore always runs the live gate.
          #
          # knowledge_base/*.md is deliberately NOT e2e-exempt: those markdown
          # files are loaded into the live AI context, so a change there can
          # alter real model output. live-e2e (real AI) is the only gate that
          # exercises that path — the integration suites run on mock AI — so a
          # knowledge_base edit must always run the live gate even though it is
          # still docs_only for the mock-AI integration suites.
          #
          # Note: these are `case` patterns, not filename globs. In a `case`
          # (and `[[ ==` ]]) the `*` wildcard matches `/`, so `docs/*` and
          # `knowledge_base/*` already cover arbitrarily nested paths (e.g.
          # docs/superpowers/deep/guide.md, knowledge_base/aro/x/y.md). Do NOT
          # rewrite these into a filename-expansion context (globstar, `for f
          # in docs/*`) where `*` stops at `/` — that would silently narrow the
          # match to a single segment and break the nested-path coverage.
          docs_only=true
          e2e_exempt=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.md|*.mdx|docs/*)
                ;;
              *)
                docs_only=false
                ;;
            esac
            case "$file" in
              knowledge_base/*)
                e2e_exempt=false
                ;;
              *.md|*.mdx|docs/*|.gitignore|.gitattributes|LICENSE*|.editorconfig)
                ;;
              *)
                e2e_exempt=false
                ;;
            esac
          done

          if [[ "${docs_only}" == "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "run_integration=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected; integration suites skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "Code-related change detected; integration suites enabled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${e2e_exempt}" == "true" ]]; then
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Inert change (docs/repo-meta only); live E2E skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Runtime-relevant change; live E2E enabled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Ensure SHA-pinned actions
        # v5.0.3
        uses: >-
          zgosalvez/github-actions-ensure-sha-pinned-actions@c5fc58bd0be7a4b94b73ce40250322d5b838a108

      - name: Install dependencies
        run: make install

      - name: Validate (lint + typecheck)
        run: make validate

      - name: Check unused exports (hygiene, non-blocking)
        continue-on-error: true
        run: make lint-unused-exports

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make test

      - name: Compute coverage metadata
        id: coverage
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          echo "value=${coverage_value}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          summary_line="- Backend line coverage: ${coverage_value}%"
          echo "$summary_line" >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Run integration tests (mock mode)
        run: make test-integration

  integration-test-mssql:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: ${{ format('CiRun{0}!aA', github.run_id) }}
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd
          "python3 -c \"import socket; s=socket.socket();
          s.settimeout(2); s.connect(('localhost',1433)); s.close()\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Create sresimulator database
        working-directory: backend
        env:
          DB_CONN: >-
            Server=localhost;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};
            TrustServerCertificate=true
        run: |
          node -e "
            const sql = require('mssql');
            const q = 'IF DB_ID('+
              String.fromCharCode(39)+
              'sresimulator'+
              String.fromCharCode(39)+
              ') IS NULL CREATE DATABASE sresimulator';
            sql.connect(process.env.DB_CONN)
              .then(p => p.request().query(q)
                .then(() => p.close()))
              .then(() => process.exit(0))
              .catch(e => {
                console.error(e.message);
                process.exit(1);
              });
          "

      - name: Run MSSQL integration tests
        env:
          STORAGE_BACKEND: mssql
          DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make test-integration

      - name: Smoke startup with MSSQL backend
        env:
          MSSQL_DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make smoke-backend-mssql

  security:
    runs-on: ubuntu-latest
    env:
      SECURITY_FAIL_LEVEL: high
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Resolve daily Grype cache key
        id: grype-cache-key
        run: >-
          echo "key=grype-${RUNNER_OS}-v0.110.0-$(date -u +%Y-%m-%d)"
          >> "$GITHUB_OUTPUT"

      - name: Restore Grype vulnerability database
        # v4.2.4
        uses: >-
          actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/grype
          key: ${{ steps.grype-cache-key.outputs.key }}
          restore-keys: |
            grype-${{ runner.os }}-v0.110.0-

      - name: Security checks
        run: make security

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Helm lint
        run: helm lint ./helm/sre-simulator

      - name: Helm lint (generic profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm lint (ARO AI profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-aro-ai-live.example.yaml

      - name: Helm template (Route mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml

      - name: Helm template (Ingress mode via generic profile)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm template (legacy route toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=true \
            --set ingress.enabled=false

      - name: Helm template (legacy ingress toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=false \
            --set ingress.enabled=true \
            --set exposure.host=ingress.example.test

      - name: Helm template (AKS Gateway mode)
        run: bash scripts/helm-render-gateway.sh

      - name: Helm template (AKS publicService mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode=publicService \
            --set exposure.host=aks.example.test \
            --set exposure.scheme=http \
            --set frontend.service.public.loadBalancerIP=203.0.113.10 \
            --set frontend.autoscaling.enabled=true \
            --set frontend.autoscaling.minReplicas=1 \
            --set frontend.autoscaling.maxReplicas=3 \
            --set backend.autoscaling.enabled=true \
            --set backend.autoscaling.minReplicas=1 \
            --set backend.autoscaling.maxReplicas=4 \
            --set database.enabled=true \
            --set database.existingSecretName=sre-sql-creds

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Keep this false. What it prevents: checkout's default is to write
          # the workflow GITHUB_TOKEN into .git/config, and the steps below run
          # PR-controlled Terraform on the runner -- `terraform init` resolves
          # module sources this configuration names, and `terraform test`
          # evaluates its expressions. Neither needs git credentials, and this
          # job's whole contract is that it validates both roots with no cloud
          # credentials and is therefore safe on fork PRs. A token sitting in
          # the workspace is exactly the thing that contract is claiming is
          # absent.
          persist-credentials: false

      - name: Setup Terraform
        # v4.0.1
        uses: >-
          hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          # infra/oci/versions.tf floors at 1.10 (backend.tf's use_lockfile);
          # infra/ floors lower. Pin one version so a CI failure is never an
          # unannounced Terraform upgrade.
          terraform_version: "1.16.3"
          # The wrapper wraps stdout in a GitHub-Actions output block, which
          # corrupts the `terraform console` render below.
          terraform_wrapper: false

      - name: Terraform fmt
        # -recursive from infra/ covers the nested infra/oci/ root too.
        run: terraform -chdir=infra fmt -check -recursive

      # Both roots are validated and unit-tested with no cloud credentials:
      # -backend=false skips remote state entirely and every tftest.hcl uses
      # mock_provider. Applying either root stays a manual, operator-run
      # step (see infra/oci/README.md for why).
      - name: Terraform validate and test (Azure root)
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Terraform validate and test (OCI free-tier root)
        working-directory: infra/oci
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Lint the bootstrap script cloud-init actually writes
        working-directory: infra/oci
        run: |
          set -euo pipefail

          # `terraform console` refuses to run against an uninitialised
          # backend, and the real one is OCI Object Storage behind credentials
          # CI deliberately does not hold. An override file swaps in the local
          # backend for this step alone.
          #
          # Going through console rather than re-rendering the template here
          # is the whole point: the script linted below is the output of
          # compute.tf's own local.cloud_init, so it cannot drift from what
          # the instance boots. A CI-private templatefile() call could.
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init -reconfigure -input=false

          # terraform.tfvars.example doubles as the fixture, so this step also
          # proves the documented example still satisfies every variable
          # validation.
          #
          # yamldecode() is load-bearing: the step fails if the rendered
          # user_data is not parseable YAML. jsonencode() collapses the result
          # to one line; console then applies its own HCL string quoting on
          # top, hence two jq passes to unescape.
          #
          # The expression has to be a single line: `terraform console`
          # evaluates stdin one line at a time and errors on a wrapped one.
          script_path="/opt/bootstrap-k3s.sh"
          expression="jsonencode(one(["
          expression+="for f in yamldecode(local.cloud_init).write_files : "
          expression+="f.content if f.path == \"${script_path}\""
          expression+="]))"
          printf '%s\n' "${expression}" \
            | terraform console -var-file=terraform.tfvars.example \
            | jq -r . \
            | jq -r . \
            > "${RUNNER_TEMP}/bootstrap-k3s.sh"

          rm -f backend_override.tf

          if [[ ! -s "${RUNNER_TEMP}/bootstrap-k3s.sh" ]]; then
            echo "Rendered bootstrap script is empty; the write_files entry" \
              "for /opt/bootstrap-k3s.sh was not found." >&2
            exit 1
          fi

          bash -n "${RUNNER_TEMP}/bootstrap-k3s.sh"
          shellcheck "${RUNNER_TEMP}/bootstrap-k3s.sh"

  # ---------------------------------------------------------------------
  # The OCI box's deployment shape, on real k3s.
  #
  # free-e2e covers the chart on k3d, but k3d keeps ServiceLB and the stock
  # Traefik Service. The box runs the opposite: --disable=servicelb,
  # service.enabled: false, hostNetwork: true. That combination is what
  # preserves the client IP, and nothing else in CI exercises it.
  #
  # A GitHub-hosted Linux runner is already a VM, so k3s is installed
  # directly on it rather than nested inside another one. ubuntu-24.04-arm
  # is free for public repositories and matches the A1.Flex architecture.
  #
  # Three bugs found on a local aarch64 dry-run VM are the reason this job
  # exists. Two of them are only visible here:
  #
  #   * redirectTo (removed in Traefik chart v34) is a hard install failure
  #     that leaves Traefik at chart defaults with servicelb already
  #     disabled -- no ingress at all. Fresh boot catches it.
  #   * Without updateStrategy: Recreate the surge pod can never schedule on
  #     a single hostNetwork node, so the old pod keeps serving the old
  #     config while helm reports success. A fresh boot cannot see this at
  #     all; it needs a second apply, which is what the mutate step below
  #     does.
  # ---------------------------------------------------------------------
  oci-shape-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MANIFEST_DIR: /var/lib/rancher/k3s/server/manifests
      MANIFEST: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
      SHARED_CONFIG: infra/oci/traefik-config.yaml
      # CI can never complete an ACME order (no public DNS for a runner), so
      # the address is a dummy and Traefik serves its self-signed default
      # certificate. Everything below therefore uses curl -k.
      CI_ACME_EMAIL: ci@example.invalid
      PROBE_HOST: shape-probe.example.test
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        # v4.0.1
        uses: >-
          hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Install the Traefik config the box will run
        run: |
          set -euo pipefail

          # Copied, not forked. The only permitted difference from the file in
          # the repository is the ACME address, and the round-trip diff below
          # proves that is the only one -- so a CI-only tweak to make this job
          # pass cannot survive review.
          sudo mkdir -p "${MANIFEST_DIR}"
          sed "s/ACME_EMAIL_PLACEHOLDER/${CI_ACME_EMAIL}/" "${SHARED_CONFIG}" \
            | sudo tee "${MANIFEST}" >/dev/null

          diff -u "${SHARED_CONFIG}" \
            <(sudo sed "s/${CI_ACME_EMAIL}/ACME_EMAIL_PLACEHOLDER/" \
                "${MANIFEST}")
          echo "Manifest matches ${SHARED_CONFIG} byte for byte."

      - name: Install k3s with cloud-init's own flags
        run: |
          set -euo pipefail

          # The install command is lifted out of the rendered cloud-init
          # rather than retyped, so the flags cannot drift from what the
          # instance boots. Rendering goes through the Terraform root's own
          # local.cloud_init for the same reason.
          pushd infra/oci >/dev/null
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init -reconfigure -input=false >/dev/null
          expression="jsonencode(one(["
          expression+="for f in yamldecode(local.cloud_init).write_files : "
          expression+='f.content if f.path == "/opt/bootstrap-k3s.sh"'
          expression+="]))"
          printf '%s\n' "${expression}" \
            | terraform console -var-file=terraform.tfvars.example \
            | jq -r . \
            | jq -r . \
            > "${RUNNER_TEMP}/bootstrap-k3s.sh"
          rm -f backend_override.tf
          popd >/dev/null

          install_cmd="$(
            sed -n '/curl -sfL https:\/\/get\.k3s\.io/,/--tls-san/p' \
              "${RUNNER_TEMP}/bootstrap-k3s.sh"
          )"
          if ! grep -q -- '--disable=servicelb' <<<"${install_cmd}"; then
            echo "::error::Could not extract the k3s install command from" \
              "the rendered bootstrap script."
            exit 1
          fi
          echo "Running the install command cloud-init runs:"
          echo "${install_cmd}"

          # The manifest is already in place, exactly as on a fresh boot,
          # where cloud-init writes it before k3s ever starts. That ordering
          # is what makes a bad HelmChartConfig fatal instead of cosmetic.
          sudo bash -c "${install_cmd}"

          mkdir -p "${HOME}/.kube"
          sudo cp /etc/rancher/k3s/k3s.yaml "${HOME}/.kube/config"
          sudo chown "$(id -u):$(id -g)" "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Wait for the node and for Traefik
        run: |
          set -euo pipefail
          kubectl wait --for=condition=Ready node --all --timeout=300s
          job_selector='helmcharts.helm.cattle.io/chart=traefik'
          for _ in $(seq 1 60); do
            if kubectl -n kube-system get deploy/traefik >/dev/null 2>&1; then
              break
            fi
            # An invalid HelmChartConfig makes the install job fail rather
            # than the Deployment appear late, and waiting out the rollout
            # timeout reports that as an unexplained NotFound five minutes
            # later. The chart's own `fail` message is the actual answer, so
            # surface it the moment it exists.
            if [ "$(kubectl -n kube-system get jobs -l "${job_selector}" \
              -o jsonpath='{.items[*].status.failed}')" != "" ]; then
              echo "::error::Traefik HelmChartConfig rejected by the chart."
              kubectl -n kube-system logs -l "${job_selector}" --tail=50
              exit 1
            fi
            sleep 5
          done
          # Bug 1's signature, for the case where the job never even starts.
          kubectl -n kube-system rollout status deploy/traefik --timeout=300s

      - name: Assert the deployment shape
        run: |
          set -euo pipefail
          failed=0

          echo "--- no svclb DaemonSet (--disable=servicelb) ---"
          if kubectl -n kube-system get daemonset -o name \
            | grep -q 'svclb'; then
            echo "::error::A svclb DaemonSet exists. It contends with" \
              "hostNetwork Traefik for ports 80 and 443 and masquerades the" \
              "source address."
            failed=1
          fi

          echo "--- no traefik Service (service.enabled: false) ---"
          if kubectl -n kube-system get svc traefik >/dev/null 2>&1; then
            echo "::error::A traefik Service exists. With hostNetwork it is" \
              "dead weight that reintroduces NAT."
            failed=1
          fi

          echo "--- Traefik runs in the host network namespace ---"
          host_network="$(
            kubectl -n kube-system get deploy/traefik \
              -o jsonpath='{.spec.template.spec.hostNetwork}'
          )"
          if [[ "${host_network}" != "true" ]]; then
            echo "::error::hostNetwork is '${host_network}', not true." \
              "Without it the TCP remote address is not the client address."
            failed=1
          fi

          pod_ip="$(
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=traefik \
              -o jsonpath='{.items[0].status.podIP}'
          )"
          host_ip="$(
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=traefik \
              -o jsonpath='{.items[0].status.hostIP}'
          )"
          echo "podIP=${pod_ip} hostIP=${host_ip}"
          if [[ "${pod_ip}" != "${host_ip}" ]]; then
            echo "::error::podIP != hostIP, so Traefik is not actually in" \
              "the host network namespace."
            failed=1
          fi

          echo "--- the pinned image is the one actually running ---"
          # Every other assertion in this job passes just as happily against
          # the chart's default image, so without this one a misplaced `image:`
          # key would silently leave k3s running
          # rancher/mirrored-library-traefik:3.3.6 -- 4 CRITICAL CVEs in the
          # TLS path this pod terminates -- and the gate would stay green.
          #
          # The expectation is read out of the shared file rather than
          # hardcoded here, because that file's own comment says the tag no
          # longer tracks the chart appVersion and has to be bumped by hand.
          # A hardcoded copy would turn every bump into a two-file edit and
          # would eventually be the stale one.
          pinned_repo="$(
            sed -n 's/^ *repository: *//p' "${SHARED_CONFIG}" | head -1
          )"
          pinned_tag="$(sed -n 's/^ *tag: *//p' "${SHARED_CONFIG}" | head -1)"
          if [[ -z "${pinned_repo}" || -z "${pinned_tag}" ]]; then
            echo "::error::Could not read image.repository/image.tag out of" \
              "${SHARED_CONFIG}. The pin is what keeps an internet-facing" \
              "ingress off a 4-critical-CVE base image; a gate that cannot" \
              "find it must fail, not skip."
            failed=1
          fi
          running_image="$(
            kubectl -n kube-system get deploy/traefik \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
          )"
          echo "pinned=${pinned_repo}:${pinned_tag} running=${running_image}"
          if [[ "${running_image}" != "${pinned_repo}:${pinned_tag}" ]]; then
            echo "::error::Traefik is running '${running_image}' but" \
              "${SHARED_CONFIG} pins '${pinned_repo}:${pinned_tag}'. The" \
              "image override did not take effect."
            failed=1
          fi

          exit "${failed}"

      - name: Deploy a header-echoing probe behind the Ingress
        run: |
          set -euo pipefail
          # traefik/whoami echoes the request headers it received, which is a
          # far more direct read on client-IP integrity than any application
          # response. It is published for linux/arm64.
          kubectl create namespace shape-probe
          kubectl -n shape-probe create deployment whoami \
            --image=traefik/whoami:v1.10.2
          kubectl -n shape-probe expose deployment whoami --port=80
          kubectl -n shape-probe create ingress whoami \
            --class=traefik \
            --rule="${PROBE_HOST}/*=whoami:80"
          kubectl -n shape-probe rollout status deploy/whoami --timeout=180s

      - name: Assert the redirect and client-IP integrity
        run: |
          set -euo pipefail

          # The request must come from a genuine non-loopback source. Loopback
          # and SSH-tunnelled traffic prove nothing here: on the real box they
          # hit the "-i lo -j ACCEPT" rule, and any of them would report a
          # client IP that no external caller would ever produce. A pod
          # curling the node's primary address is the closest CI can get to a
          # real external client.
          # Column 6 of `get nodes -o wide` is INTERNAL-IP.
          node_ip="$(kubectl get nodes -o wide --no-headers | awk '{print $6}')"
          echo "node_ip=${node_ip}"

          kubectl -n shape-probe run client \
            --image=curlimages/curl:8.13.0 \
            --restart=Never \
            --command -- sh -c "
              echo \"PROBE_POD_IP=\$(hostname -i)\";
              echo \"REDIRECT_CODE=\$(curl -s -o /dev/null -w '%{http_code}' \
                -H 'Host: ${PROBE_HOST}' http://${node_ip}/)\";
              echo '--- whoami over https ---';
              curl -sk -H 'Host: ${PROBE_HOST}' https://${node_ip}/
            "
          kubectl -n shape-probe wait pod/client \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=180s
          out="$(kubectl -n shape-probe logs pod/client)"
          echo "${out}"

          probe_ip="$(
            sed -n 's/^PROBE_POD_IP=//p' <<<"${out}" | tr -d '[:space:]'
          )"
          redirect_code="$(
            sed -n 's/^REDIRECT_CODE=//p' <<<"${out}" | tr -d '[:space:]'
          )"
          real_ip="$(
            grep -i '^X-Real-Ip:' <<<"${out}" | head -1 | cut -d: -f2- \
              | tr -d '[:space:]'
          )"

          failed=0

          # Bug 1: with the removed redirectTo syntax the chart install fails
          # outright, so there is no redirect to observe. Asserting the exact
          # code also pins the `permanent: true` the mutate step flips.
          if [[ "${redirect_code}" != "301" ]]; then
            echo "::error::Expected a 301 from the web entrypoint, got" \
              "'${redirect_code}'."
            failed=1
          fi

          # The load-bearing assertion of the whole OCI design.
          if [[ -z "${real_ip}" ]]; then
            echo "::error::whoami saw no X-Real-Ip header at all."
            failed=1
          elif [[ "${real_ip}" != "${probe_ip}" ]]; then
            echo "::error::X-Real-Ip is '${real_ip}' but the client was" \
              "'${probe_ip}'. The source address is being masqueraded," \
              "which breaks every per-client-IP control in the app."
            failed=1
          else
            echo "X-Real-Ip (${real_ip}) is the true client address."
          fi

          exit "${failed}"

      - name: Re-apply a changed config and prove the running pod picked it up
        run: |
          set -euo pipefail

          # This is the only step that can see bug 2, and no fresh-boot test
          # ever will. Traefik's Deployment defaults to RollingUpdate with
          # maxSurge 1 / maxUnavailable 0; with hostNetwork on a single node
          # the surge pod can never schedule ("didn't have free ports for the
          # requested pod ports"). The old pod keeps serving the OLD config,
          # `kubectl get deploy` shows the NEW args, and helm reports
          # "deployed successfully" -- so every Traefik change after the first
          # silently no-ops unless updateStrategy is Recreate.
          #
          # The assertion is deliberately behavioural rather than a read of
          # the pod spec: flipping `permanent` changes 301 to 302 on the wire,
          # which can only happen if the process actually serving traffic
          # reloaded.
          sudo sed -i 's/permanent: true/permanent: false/' "${MANIFEST}"
          grep -q 'permanent: false' <(sudo cat "${MANIFEST}")

          node_ip="$(kubectl get nodes -o wide --no-headers | awk '{print $6}')"

          observed=""
          for _ in $(seq 1 60); do
            kubectl -n shape-probe delete pod recheck --ignore-not-found \
              >/dev/null 2>&1
            kubectl -n shape-probe run recheck \
              --image=curlimages/curl:8.13.0 \
              --restart=Never --quiet --attach --rm \
              --command -- curl -s -o /dev/null -w '%{http_code}' \
                -H "Host: ${PROBE_HOST}" "http://${node_ip}/" \
              > "${RUNNER_TEMP}/code" 2>/dev/null || true
            observed="$(tr -dc '0-9' < "${RUNNER_TEMP}/code")"
            if [[ "${observed}" == "302" ]]; then
              break
            fi
            sleep 5
          done

          if [[ "${observed}" != "302" ]]; then
            echo "::error::After re-applying the HelmChartConfig the running" \
              "Traefik still answers '${observed}', not 302. The rollout is" \
              "deadlocked -- check that updateStrategy.type is Recreate."
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=traefik -o wide || true
            exit 1
          fi
          echo "The running Traefik picked up the second apply."

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          echo "--- nodes ---"
          kubectl get nodes -o wide || true
          echo "--- kube-system ---"
          kubectl -n kube-system get deploy,ds,svc,pod -o wide || true
          echo "--- helm jobs ---"
          kubectl -n kube-system get jobs -o wide || true
          echo "--- helm install job logs ---"
          kubectl -n kube-system logs \
            -l helmcharts.helm.cattle.io/chart=traefik --tail=200 || true
          echo "--- traefik pod detail ---"
          kubectl -n kube-system describe pods \
            -l app.kubernetes.io/name=traefik || true
          echo "--- traefik logs ---"
          kubectl -n kube-system logs deploy/traefik --tail=200 || true
          echo "--- probe namespace ---"
          kubectl -n shape-probe get all -o wide || true
          echo "--- installed manifest ---"
          sudo cat "${MANIFEST}" || true
          echo "--- k3s service ---"
          sudo journalctl -u k3s --no-pager --lines=200 || true

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load Bun version
        uses: ./.github/actions/load-bun-version

      - name: Build Docker image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          COMPONENT: ${{ matrix.component }}
        run: >-
          docker build
          --build-arg BUN_VERSION="${BUN_VERSION}"
          -f "${DOCKERFILE}"
          -t "sre-simulator-${COMPONENT}"
          .

  live-e2e:
    needs:
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_e2e != 'false' &&
      needs.lint-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.helm-validate.result == 'success' &&
      needs.docker-build.result == 'success' &&
      (
        needs.changes.outputs.run_integration != 'true' ||
        (
          needs.integration-test.result == 'success' &&
          needs.integration-test-mssql.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: live-e2e
    concurrency:
      group: sresimulator-live-e2e-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      CLUSTER_FLAVOR: aks
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_RG: ${{ secrets.AKS_RG }}
      AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}
      AOAI_RG: ${{ secrets.AOAI_RG }}
      AOAI_ACCOUNT: ${{ secrets.AOAI_ACCOUNT }}
      AOAI_DEPLOYMENT: ${{ secrets.AOAI_DEPLOYMENT }}
      AOAI_DEPLOYMENT_CHAT: ${{ secrets.AOAI_DEPLOYMENT_CHAT }}
      AOAI_DEPLOYMENT_COMMAND: ${{ secrets.AOAI_DEPLOYMENT_COMMAND }}
      AOAI_DEPLOYMENT_SCENARIO: ${{ secrets.AOAI_DEPLOYMENT_SCENARIO }}
      AOAI_DEPLOYMENT_PROBE: ${{ secrets.AOAI_DEPLOYMENT_PROBE }}
      GITHUB_AUTH_SECRET_NAME: >-
        ${{
          vars.AUTH_SECRET_NAME ||
          secrets.AUTH_SECRET_NAME ||
          vars.GITHUB_AUTH_SECRET_NAME ||
          secrets.GITHUB_AUTH_SECRET_NAME ||
          'sre-auth-secrets'
        }}
      AUTH_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      DB_SECRET_NAME: ${{ secrets.DB_SECRET_NAME }}
      DB_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      PROD_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      E2E_NAMESPACE_PREFIX: sre-pr-${{ github.event.number }}
      E2E_METADATA_FILE: data/live-e2e-${{ github.event.number }}.env
      E2E_RELEASE: sre-simulator
      AKS_E2E_EXPOSURE_MODE: none
      AKS_E2E_PUSH_DEV_IMAGES: "true"
      # Reuse the previous push's image layers instead of reinstalling
      # node_modules and rebuilding the frontend bundle every time. The deploy
      # step spent 116 of its 196 seconds rebuilding images that had not
      # changed.
      AKS_E2E_IMAGE_CACHE: "true"
      AKS_E2E_DEV_IMAGE_TAG_SUFFIX: dev
      GHCR_USERNAME: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
      TURNSTILE_TEST_MODE: "true"
      LOCAL_TEST_VERIFICATION_ENABLED: "true"
      LIVE_E2E_ARTIFACT_DIR: >-
        data/playwright-live-e2e-${{ github.event.number }}
      LIVE_E2E_VIEWER_PREFIX: >-
        pr-${{ github.event.number }}-${{ github.run_id }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Azure login
        # v3.0.0
        uses: >-
          azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate privileged E2E configuration
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_SUBSCRIPTION_ID AKS_RG AKS_CLUSTER \
            AOAI_RG AOAI_ACCOUNT AOAI_DEPLOYMENT \
            GITHUB_AUTH_SECRET_NAME DB_SECRET_NAME PROD_NAMESPACE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing live E2E configuration: ${missing[*]}"
            exit 1
          fi

      - name: Deploy PR head to isolated E2E namespace
        run: make e2e-azure-route-up

      - name: Install Playwright Chromium
        run: make playwright-install

      - name: Run live Playwright platform flows
        run: |
          set -euo pipefail
          ns="$(sed -n 's/^NS=//p' "$E2E_METADATA_FILE")"
          base_url="$(sed -n 's/^URL=//p' "$E2E_METADATA_FILE")"
          session_secret="$(
            kubectl -n "$ns" get "secret/$GITHUB_AUTH_SECRET_NAME" \
              -o jsonpath='{.data.auth-session-secret}' |
              base64 --decode
          )"
          if [[ -z "$ns" || -z "$base_url" || -z "$session_secret" ]]; then
            echo "E2E metadata or auth session secret is missing."
            exit 1
          fi
          export LIVE_E2E_BASE_URL="$base_url"
          export LIVE_E2E_AUTH_SESSION_SECRET="$session_secret"
          make test-e2e-live
          unset LIVE_E2E_AUTH_SESSION_SECRET session_secret

      - name: Add live E2E result summary
        if: always()
        run: |
          if [[ -f "$LIVE_E2E_ARTIFACT_DIR/results.json" ]]; then
            echo "### Live Playwright E2E" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$LIVE_E2E_ARTIFACT_DIR/results.json" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live E2E artifacts
        if: always()
        # v4.6.2
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-e2e-pr-${{ github.event.number }}
          path: ${{ env.LIVE_E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary E2E namespace
        if: always()
        run: |
          if [[ -f "$E2E_METADATA_FILE" ]]; then
            make e2e-azure-route-down
          fi

  ci-gate:
    if: always()
    permissions:
      contents: read
      statuses: read
    needs:
      - tag-mainline-check
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - terraform-validate
      - oci-shape-e2e
      - docker-build
      - live-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TAG_MAINLINE_RESULT: ${{ needs.tag-mainline-check.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
          LINT_RESULT: ${{ needs.lint-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          INTEGRATION_MSSQL_RESULT: ${{ needs.integration-test-mssql.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          HELM_RESULT: ${{ needs.helm-validate.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-validate.result }}
          OCI_SHAPE_RESULT: ${{ needs.oci-shape-e2e.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          LIVE_E2E_RESULT: ${{ needs.live-e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_DEPENDABOT: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.user.login == 'dependabot[bot]' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=false
          failed_jobs=()

          echo "CI job results:"
          echo "  tag-mainline-check:         ${TAG_MAINLINE_RESULT}"
          echo "  changes:                    ${CHANGES_RESULT}"
          echo "  docs-only change:           ${DOCS_ONLY}"
          echo "  run integration suites:     ${RUN_INTEGRATION}"
          echo "  lint-typecheck:             ${LINT_RESULT}"
          echo "  test:                       ${TEST_RESULT}"
          echo "  integration-test:           ${INTEGRATION_RESULT}"
          echo "  integration-test-mssql:     ${INTEGRATION_MSSQL_RESULT}"
          echo "  security:                   ${SECURITY_RESULT}"
          echo "  helm-validate:              ${HELM_RESULT}"
          echo "  terraform-validate:         ${TERRAFORM_RESULT}"
          echo "  oci-shape-e2e:              ${OCI_SHAPE_RESULT}"
          echo "  docker-build:               ${DOCKER_RESULT}"
          echo "  run live e2e:               ${RUN_E2E}"
          echo "  live-e2e:                   ${LIVE_E2E_RESULT}"

          for name_result in \
            "tag-mainline-check:${TAG_MAINLINE_RESULT}" \
            "changes:${CHANGES_RESULT}" \
            "lint-typecheck:${LINT_RESULT}" \
            "test:${TEST_RESULT}" \
            "security:${SECURITY_RESULT}" \
            "helm-validate:${HELM_RESULT}" \
            "terraform-validate:${TERRAFORM_RESULT}" \
            "oci-shape-e2e:${OCI_SHAPE_RESULT}" \
            "docker-build:${DOCKER_RESULT}"; do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            if [[ "$result" != "success" ]]; then
              failed=true
              failed_jobs+=("${name} (${result})")
            fi
          done

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${IS_DEPENDABOT}" == "true" ]]; then
              # Dependabot E2E runs claim a namespace from a fixed-size pool
              # and a single run takes ~20 minutes, so once every slot is busy
              # the wait has to cover a queue of PRs, not a single run.
              dependabot_e2e_state=""
              for _ in $(seq 1 210); do
                dependabot_e2e_state="$(
                  gh api \
                    "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/status" \
                    --jq '
                      [
                        .statuses[] |
                        select(.context == "dependabot-e2e")
                      ] |
                      sort_by(.created_at) |
                      last |
                      .state // ""
                    '
                )"
                case "${dependabot_e2e_state}" in
                  success)
                    break
                    ;;
                  failure|error)
                    break
                    ;;
                esac
                sleep 20
              done
              if [[ "${dependabot_e2e_state}" != "success" ]]; then
                failed=true
                failed_jobs+=(
                  "dependabot-e2e (${dependabot_e2e_state:-missing})"
                )
                case "${dependabot_e2e_state}" in
                  ""|pending)
                    echo ""
                    echo "The dependabot-e2e status never reached a terminal" \
                      "state within the wait window."
                    echo "This usually means every namespace in the" \
                      "Dependabot E2E pool was busy, so the run could not" \
                      "claim a slot. Check DEPENDABOT_E2E_NAMESPACE_POOL and" \
                      "whether the pool is large enough for the number of" \
                      "open Dependabot PRs."
                    echo "It is not evidence that this dependency update is" \
                      "broken. Re-run 'Dependabot E2E Build' for this PR once" \
                      "the pool has capacity."
                    ;;
                esac
              fi
            elif [[ "${RUN_E2E}" == "false" ]]; then
              echo "Live E2E intentionally skipped (inert docs/repo-meta" \
                "change)."
            elif [[ "${LIVE_E2E_RESULT}" != "success" ]]; then
              failed=true
              failed_jobs+=("live-e2e (${LIVE_E2E_RESULT})")
            fi
          else
            echo "Live E2E is required for pull requests only."
          fi

          if [[ "${RUN_INTEGRATION}" == "true" ]]; then
            for name_result in \
              "integration-test:${INTEGRATION_RESULT}" \
              "integration-test-mssql:${INTEGRATION_MSSQL_RESULT}"; do
              name="${name_result%%:*}"
              result="${name_result#*:}"
              if [[ "$result" != "success" ]]; then
                failed=true
                failed_jobs+=("${name} (${result})")
              fi
            done
          else
            echo "Integration suites intentionally skipped (docs-only change)."
          fi

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "Failed jobs:"
            for job in "${failed_jobs[@]}"; do
              echo "  - ${job}"
            done
            exit 1
          fi
          echo "All CI jobs passed."

  update-coverage-badge:
    runs-on: ubuntu-latest
    needs:
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Run backend tests with coverage
        run: make test

      - name: Generate coverage badge
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          mkdir -p badges
          coverage_label="${coverage_value}%25"
          badge_url="https://img.shields.io/badge/coverage-"
          badge_url+="${coverage_label}-${color}.svg"
          curl -fsSL "$badge_url" -o badges/coverage.svg

      - name: Commit updated coverage badge
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge is already up to date."
            exit 0
          fi
          git add badges/coverage.svg
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(ci): update coverage badge [skip ci]"
          push_output="$(mktemp)"
          if git push origin HEAD:main >"${push_output}" 2>&1; then
            rm -f "${push_output}"
            exit 0
          fi
          if grep -Eiq \
            '(protected branch|GH006|repository rule violations|ruleset)' \
            "${push_output}"; then
            echo "::warning::Coverage badge push blocked by repository rules."
            echo "::warning::Skipping badge update push on protected main."
            cat "${push_output}"
            rm -f "${push_output}"
            exit 0
          fi
          echo "::error::Failed to push updated coverage badge."
          cat "${push_output}"
          rm -f "${push_output}"
          exit 1
