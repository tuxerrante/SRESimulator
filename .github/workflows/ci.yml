---
name: CI

"on":
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  direct-push-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Flag direct push to main
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "::warning::Direct push to main detected — use a PR instead."
          echo "Pushed by: ${ACTOR} (${SHA})"

  tag-mainline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # v6.3.0
        uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Verify semver tag ancestry
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "Not a push event; skipping tag ancestry check."
            exit 0
          fi
          if [[ ! "${REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semver tag push; skipping tag ancestry check."
            exit 0
          fi

          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${SHA}" "origin/main"; then
            echo "Tag ${REF} points to ${SHA}, outside main history."
            echo "Release tags must be created from main."
            exit 1
          fi
          echo "Tag commit is on main history."

      - name: Verify semver surfaces for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-version-sync.mjs verify --tag "${RELEASE_TAG}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      run_integration: ${{ steps.detect.outputs.run_integration }}
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
          fi

          # Fall back to running integration if diff endpoints are unavailable.
          if [[ -z "${base_sha}" ]] || [[ "${base_sha}" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Unable to determine diff base; running integration and E2E." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Use merge-base diff for PRs to ignore unrelated base-only commits.
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}...${head_sha}"
            )
          else
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}" "${head_sha}"
            )
          fi

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running integration and E2E." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # docs_only skips the (cheap) integration suites. e2e_exempt also
          # skips the expensive, manually-approved live-e2e cluster gate. Both
          # are strict positive allowlists: any file outside the allowlist
          # forces the corresponding suite to run (fail-safe default). The e2e
          # allowlist is a superset of docs (it additionally permits inert
          # repo-meta files such as .gitignore) because those can never affect
          # runtime, build, or deploy behavior and so cannot change an E2E
          # outcome. Anything that can — source, .github/**, scripts/**,
          # helm/**, infra/**, Dockerfiles, package/lock files, Makefile — is
          # unlisted and therefore always runs the live gate.
          #
          # knowledge_base/*.md is deliberately NOT e2e-exempt: those markdown
          # files are loaded into the live AI context, so a change there can
          # alter real model output. live-e2e (real AI) is the only gate that
          # exercises that path — the integration suites run on mock AI — so a
          # knowledge_base edit must always run the live gate even though it is
          # still docs_only for the mock-AI integration suites.
          #
          # Note: these are `case` patterns, not filename globs. In a `case`
          # (and `[[ ==` ]]) the `*` wildcard matches `/`, so `docs/*` and
          # `knowledge_base/*` already cover arbitrarily nested paths (e.g.
          # docs/superpowers/deep/guide.md, knowledge_base/aro/x/y.md). Do NOT
          # rewrite these into a filename-expansion context (globstar, `for f
          # in docs/*`) where `*` stops at `/` — that would silently narrow the
          # match to a single segment and break the nested-path coverage.
          docs_only=true
          e2e_exempt=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.md|*.mdx|docs/*)
                ;;
              *)
                docs_only=false
                ;;
            esac
            case "$file" in
              knowledge_base/*)
                e2e_exempt=false
                ;;
              *.md|*.mdx|docs/*|.gitignore|.gitattributes|LICENSE*|.editorconfig)
                ;;
              *)
                e2e_exempt=false
                ;;
            esac
          done

          if [[ "${docs_only}" == "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "run_integration=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected; integration suites skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "Code-related change detected; integration suites enabled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${e2e_exempt}" == "true" ]]; then
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Inert change (docs/repo-meta only); live E2E skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Runtime-relevant change; live E2E enabled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Ensure SHA-pinned actions
        # v5.0.3
        uses: >-
          zgosalvez/github-actions-ensure-sha-pinned-actions@c5fc58bd0be7a4b94b73ce40250322d5b838a108

      - name: Install dependencies
        run: make install

      - name: Validate (lint + typecheck)
        run: make validate

      - name: Check unused exports (hygiene, non-blocking)
        continue-on-error: true
        run: make lint-unused-exports

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make test

      - name: Compute coverage metadata
        id: coverage
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          echo "value=${coverage_value}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          summary_line="- Backend line coverage: ${coverage_value}%"
          echo "$summary_line" >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Run integration tests (mock mode)
        run: make test-integration

  integration-test-mssql:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: ${{ format('CiRun{0}!aA', github.run_id) }}
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd
          "python3 -c \"import socket; s=socket.socket();
          s.settimeout(2); s.connect(('localhost',1433)); s.close()\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Create sresimulator database
        working-directory: backend
        env:
          DB_CONN: >-
            Server=localhost;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};
            TrustServerCertificate=true
        run: |
          node -e "
            const sql = require('mssql');
            const q = 'IF DB_ID('+
              String.fromCharCode(39)+
              'sresimulator'+
              String.fromCharCode(39)+
              ') IS NULL CREATE DATABASE sresimulator';
            sql.connect(process.env.DB_CONN)
              .then(p => p.request().query(q)
                .then(() => p.close()))
              .then(() => process.exit(0))
              .catch(e => {
                console.error(e.message);
                process.exit(1);
              });
          "

      - name: Run MSSQL integration tests
        env:
          STORAGE_BACKEND: mssql
          DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make test-integration

      - name: Smoke startup with MSSQL backend
        env:
          MSSQL_DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make smoke-backend-mssql

  security:
    runs-on: ubuntu-latest
    env:
      SECURITY_FAIL_LEVEL: high
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Resolve daily Grype cache key
        id: grype-cache-key
        run: >-
          echo "key=grype-${RUNNER_OS}-v0.110.0-$(date -u +%Y-%m-%d)"
          >> "$GITHUB_OUTPUT"

      - name: Restore Grype vulnerability database
        # v4.2.4
        uses: >-
          actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/grype
          key: ${{ steps.grype-cache-key.outputs.key }}
          restore-keys: |
            grype-${{ runner.os }}-v0.110.0-

      - name: Security checks
        run: make security

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Helm lint
        run: helm lint ./helm/sre-simulator

      - name: Helm lint (generic profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm lint (ARO AI profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-aro-ai-live.example.yaml

      - name: Helm lint (OCI free-tier profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-oci.yaml

      - name: Helm lint (OCI free-tier profile + CI k3d overlay)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-oci.yaml \
            --values ./helm/sre-simulator/values-ci-k3d.yaml

      - name: Helm template (Route mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml

      - name: Helm template (Ingress mode via generic profile)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm template (OCI free-tier profile)
        run: |
          set -euo pipefail
          rendered="$(
            helm template sre-simulator ./helm/sre-simulator \
              --values ./helm/sre-simulator/values.yaml \
              --values ./helm/sre-simulator/values-oci.yaml
          )"
          # Traefik terminates TLS with its own ACME resolver, so the router
          # annotations are the whole TLS story for this profile: no
          # Kubernetes Secret, no ingress.tls block.
          for annotation in \
            "traefik.ingress.kubernetes.io/router.entrypoints: websecure" \
            "traefik.ingress.kubernetes.io/router.tls: \"true\"" \
            "traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt"
          do
            if ! grep -Fq -- "${annotation}" <<<"${rendered}"; then
              echo "::error::OCI profile did not render ${annotation}"
              exit 1
            fi
          done

      - name: Helm template (OCI free-tier profile + CI k3d overlay)
        run: |
          set -euo pipefail
          rendered="$(
            helm template sre-simulator ./helm/sre-simulator \
              --values ./helm/sre-simulator/values.yaml \
              --values ./helm/sre-simulator/values-oci.yaml \
              --values ./helm/sre-simulator/values-ci-k3d.yaml
          )"
          # An unsatisfiable HTTP-01 challenge inside k3d would leave the
          # router without a certificate and fail every request, so the CI
          # overlay must clear the cert resolver entirely.
          if grep -Fq -- "traefik.ingress.kubernetes.io/router.tls" \
            <<<"${rendered}"; then
            echo "::error::CI k3d overlay must not request ACME TLS"
            exit 1
          fi

      - name: Helm template (legacy route toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=true \
            --set ingress.enabled=false

      - name: Helm template (legacy ingress toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=false \
            --set ingress.enabled=true \
            --set exposure.host=ingress.example.test

      - name: Helm template (AKS Gateway mode)
        run: bash scripts/helm-render-gateway.sh

      - name: Helm template (AKS publicService mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode=publicService \
            --set exposure.host=aks.example.test \
            --set exposure.scheme=http \
            --set frontend.service.public.loadBalancerIP=203.0.113.10 \
            --set frontend.autoscaling.enabled=true \
            --set frontend.autoscaling.minReplicas=1 \
            --set frontend.autoscaling.maxReplicas=3 \
            --set backend.autoscaling.enabled=true \
            --set backend.autoscaling.minReplicas=1 \
            --set backend.autoscaling.maxReplicas=4 \
            --set database.enabled=true \
            --set database.existingSecretName=sre-sql-creds

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load Bun version
        uses: ./.github/actions/load-bun-version

      - name: Build Docker image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          COMPONENT: ${{ matrix.component }}
        run: >-
          docker build
          --build-arg BUN_VERSION="${BUN_VERSION}"
          -f "${DOCKERFILE}"
          -t "sre-simulator-${COMPONENT}"
          .

  # Merge-blocking browser gate. Runs entirely on GitHub-hosted infrastructure
  # with no cloud credentials, no GitHub Environment and no secrets, so it
  # works on fork PRs and Dependabot PRs too.
  #
  # k3d (not kind) on purpose: it runs the same k3s distribution as the OCI
  # production box, including the bundled Traefik ingress, local-path storage
  # and kube-router NetworkPolicy enforcement. That makes this gate double as
  # the regression test for values-oci.yaml.
  free-e2e:
    needs:
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_e2e != 'false' &&
      needs.lint-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.helm-validate.result == 'success' &&
      needs.docker-build.result == 'success' &&
      (
        needs.changes.outputs.run_integration != 'true' ||
        (
          needs.integration-test.result == 'success' &&
          needs.integration-test-mssql.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_RELEASE: sre-simulator
      E2E_NAMESPACE: sre-free-e2e
      K3D_CLUSTER: sre-free-e2e
      K3D_VERSION: v5.9.0
      K3D_SHA256: >-
        06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
      K3S_IMAGE: docker.io/rancher/k3s:v1.37.0-k3s1
      # *.localhost, not *.localtest.me: both resolve to loopback, but only
      # *.localhost is a browser "secure context". Off a secure context
      # Chromium hides crypto.randomUUID and crypto.subtle, which the chat
      # (hooks/useChat.ts) and the anonymous fingerprint
      # (lib/auth/fingerprint.ts) call unguarded - the suite then fails with
      # no 5xx, no failed request and no console error.
      E2E_HOST: sre-simulator.localhost
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Load Bun version
        id: bun
        uses: ./.github/actions/load-bun-version

      - name: Install dependencies
        run: make install

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      # Both images are rebuilt here rather than reused from docker-build.
      # That job runs a plain `docker build` with no cache export, no artifact
      # upload and no registry push, so its images never leave its own runner,
      # and publishing them to GHCR from a PR-head workflow would need the
      # registry credentials this gate exists to do without. It stays in
      # `needs:` as the cheap fail-fast check; the dedicated free-e2e-* GHA
      # cache scopes below are what actually keep the rebuild short.
      - name: Set up Docker Buildx
        # v4.3.0
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container

      - name: Build frontend image
        # v7.3.0
        uses: >-
          docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: frontend/Dockerfile
          tags: sre-simulator-frontend:pr
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          load: true
          cache-from: type=gha,scope=free-e2e-frontend
          cache-to: >-
            type=gha,scope=free-e2e-frontend,mode=max,ignore-error=true

      - name: Build backend image
        # v7.3.0
        uses: >-
          docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: backend/Dockerfile
          tags: sre-simulator-backend:pr
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          load: true
          cache-from: type=gha,scope=free-e2e-backend
          cache-to: >-
            type=gha,scope=free-e2e-backend,mode=max,ignore-error=true

      - name: Install k3d
        run: |
          set -euo pipefail
          url="https://github.com/k3d-io/k3d/releases/download"
          curl -fsSL "${url}/${K3D_VERSION}/k3d-linux-amd64" -o /tmp/k3d
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum --check --strict
          chmod +x /tmp/k3d
          sudo mv /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Create k3d cluster
        run: |
          set -euo pipefail
          # --port 80:80@loadbalancer publishes Traefik on the runner's port
          # 80, and Chromium maps *.localhost to loopback internally, so the
          # browser reaches the ingress with no /etc/hosts edit and no
          # port-forward. The readiness poll below sends an explicit Host
          # header to 127.0.0.1 and so needs no name resolution at all.
          # metrics-server is disabled to match the single-node OCI install,
          # where there is no HPA to feed.
          k3d cluster create "${K3D_CLUSTER}" \
            --agents 0 \
            --image "${K3S_IMAGE}" \
            --port "80:80@loadbalancer" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --wait \
            --timeout 180s
          kubectl cluster-info
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Import images into k3d
        run: |
          set -euo pipefail
          k3d image import \
            sre-simulator-frontend:pr \
            sre-simulator-backend:pr \
            --cluster "${K3D_CLUSTER}"

      - name: Wait for bundled Traefik
        run: |
          set -euo pipefail
          # Traefik arrives via a HelmChart CR, so the Deployment does not
          # exist immediately after the cluster reports ready.
          for _ in $(seq 1 60); do
            if kubectl -n kube-system get deploy/traefik \
              >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl -n kube-system rollout status deploy/traefik --timeout=180s

      - name: Deploy chart (OCI profile, mock AI, JSON storage)
        run: |
          set -euo pipefail
          session_secret="$(openssl rand -hex 32)"
          anti_abuse_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${session_secret}"
          echo "::add-mask::${anti_abuse_secret}"
          echo "LIVE_E2E_AUTH_SESSION_SECRET=${session_secret}" \
            >> "$GITHUB_ENV"

          kubectl create namespace "${E2E_NAMESPACE}"
          kubectl -n "${E2E_NAMESPACE}" create secret generic \
            free-e2e-runtime \
            --from-literal=auth-session-secret="${session_secret}" \
            --from-literal=anti-abuse-hmac-secret="${anti_abuse_secret}" \
            --from-literal=turnstile-secret-key=free-e2e-test-secret \
            --dry-run=client -o yaml |
            kubectl apply -f -

          # Three values files, then the mock-AI / JSON-storage overrides that
          # the Dependabot E2E path already proves the browser suite passes
          # against. AI and storage stay at chart defaults in values-oci.yaml
          # itself, so they have to be set here.
          helm upgrade --install "${E2E_RELEASE}" ./helm/sre-simulator \
            --namespace "${E2E_NAMESPACE}" \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-oci.yaml \
            --values ./helm/sre-simulator/values-ci-k3d.yaml \
            --set-string "fullnameOverride=${E2E_RELEASE}" \
            --set-string "frontend.image.repository=sre-simulator-frontend" \
            --set-string "frontend.image.tag=pr" \
            --set frontend.image.pullPolicy=Never \
            --set-string "backend.image.repository=sre-simulator-backend" \
            --set-string "backend.image.tag=pr" \
            --set backend.image.pullPolicy=Never \
            --set ai.mockMode=true \
            --set ai.strictStartup=false \
            --set database.enabled=false \
            --set storage.enabled=false \
            --set backend.allowDeployedJsonStorageForTests=true \
            --set frontend.auth.githubOAuthEnabled=false \
            --set frontend.auth.existingSecretName=free-e2e-runtime \
            --set frontend.auth.antiAbuseHmacSecretKey=anti-abuse-hmac-secret \
            --set backend.auth.existingSecretName=free-e2e-runtime \
            --set backend.auth.antiAbuseHmacSecretKey=anti-abuse-hmac-secret \
            --set backend.auth.turnstileSecretKey=turnstile-secret-key \
            --set backend.auth.turnstileTestMode=true \
            --set backend.auth.localTestVerificationEnabled=true \
            --wait --timeout 10m

      - name: Wait for ingress to answer
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -H "Host: ${E2E_HOST}" http://127.0.0.1/ \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "::error::Ingress did not answer on http://${E2E_HOST}/"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: make playwright-install

      - name: Run browser E2E
        env:
          # Derived from E2E_HOST so the gate host has exactly one definition
          # in this workflow. It has to stay a *.localhost name; see the
          # E2E_HOST comment above.
          LIVE_E2E_BASE_URL: http://${{ env.E2E_HOST }}
        run: make test-e2e-live

      - name: Helm test
        run: |
          set -euo pipefail
          helm test "${E2E_RELEASE}" \
            --namespace "${E2E_NAMESPACE}" \
            --logs \
            --timeout 4m

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          echo "--- ingress ---"
          kubectl -n "${E2E_NAMESPACE}" get ingress -o wide || true
          echo "--- workloads ---"
          kubectl -n "${E2E_NAMESPACE}" get \
            deploy,pod,svc,endpoints -o wide || true
          echo "--- pod detail ---"
          kubectl -n "${E2E_NAMESPACE}" describe pods || true
          echo "--- frontend logs ---"
          kubectl -n "${E2E_NAMESPACE}" logs \
            "deployment/${E2E_RELEASE}-frontend" --tail=200 || true
          echo "--- backend logs ---"
          kubectl -n "${E2E_NAMESPACE}" logs \
            "deployment/${E2E_RELEASE}-backend" --tail=200 || true
          echo "--- traefik logs ---"
          kubectl -n kube-system logs deploy/traefik --tail=200 || true
          # `helm test --logs` prints only the test container, which never
          # starts when the wait-for-network-policy init container times out.
          echo "--- helm test pod logs (all containers) ---"
          kubectl -n "${E2E_NAMESPACE}" logs "${E2E_RELEASE}-test" \
            --all-containers=true --tail=200 || true

      - name: Upload E2E artifacts
        if: always()
        # v4.6.2
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: free-e2e-artifacts
          path: data/playwright-live-e2e*
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete "${K3D_CLUSTER}" || true

  live-e2e:
    needs:
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
    if: >-
      always() &&
      vars.LIVE_E2E_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_e2e != 'false' &&
      needs.lint-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.helm-validate.result == 'success' &&
      needs.docker-build.result == 'success' &&
      (
        needs.changes.outputs.run_integration != 'true' ||
        (
          needs.integration-test.result == 'success' &&
          needs.integration-test-mssql.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: live-e2e
    concurrency:
      group: sresimulator-live-e2e-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      CLUSTER_FLAVOR: aks
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_RG: ${{ secrets.AKS_RG }}
      AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}
      AOAI_RG: ${{ secrets.AOAI_RG }}
      AOAI_ACCOUNT: ${{ secrets.AOAI_ACCOUNT }}
      AOAI_DEPLOYMENT: ${{ secrets.AOAI_DEPLOYMENT }}
      AOAI_DEPLOYMENT_CHAT: ${{ secrets.AOAI_DEPLOYMENT_CHAT }}
      AOAI_DEPLOYMENT_COMMAND: ${{ secrets.AOAI_DEPLOYMENT_COMMAND }}
      AOAI_DEPLOYMENT_SCENARIO: ${{ secrets.AOAI_DEPLOYMENT_SCENARIO }}
      AOAI_DEPLOYMENT_PROBE: ${{ secrets.AOAI_DEPLOYMENT_PROBE }}
      GITHUB_AUTH_SECRET_NAME: >-
        ${{
          vars.AUTH_SECRET_NAME ||
          secrets.AUTH_SECRET_NAME ||
          vars.GITHUB_AUTH_SECRET_NAME ||
          secrets.GITHUB_AUTH_SECRET_NAME ||
          'sre-auth-secrets'
        }}
      AUTH_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      DB_SECRET_NAME: ${{ secrets.DB_SECRET_NAME }}
      DB_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      PROD_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      E2E_NAMESPACE_PREFIX: sre-pr-${{ github.event.number }}
      E2E_METADATA_FILE: data/live-e2e-${{ github.event.number }}.env
      E2E_RELEASE: sre-simulator
      AKS_E2E_EXPOSURE_MODE: none
      AKS_E2E_PUSH_DEV_IMAGES: "true"
      # Reuse the previous push's image layers instead of reinstalling
      # node_modules and rebuilding the frontend bundle every time. The deploy
      # step spent 116 of its 196 seconds rebuilding images that had not
      # changed.
      AKS_E2E_IMAGE_CACHE: "true"
      AKS_E2E_DEV_IMAGE_TAG_SUFFIX: dev
      GHCR_USERNAME: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
      TURNSTILE_TEST_MODE: "true"
      LOCAL_TEST_VERIFICATION_ENABLED: "true"
      LIVE_E2E_ARTIFACT_DIR: >-
        data/playwright-live-e2e-${{ github.event.number }}
      LIVE_E2E_VIEWER_PREFIX: >-
        pr-${{ github.event.number }}-${{ github.run_id }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Azure login
        # v3.0.0
        uses: >-
          azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate privileged E2E configuration
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_SUBSCRIPTION_ID AKS_RG AKS_CLUSTER \
            AOAI_RG AOAI_ACCOUNT AOAI_DEPLOYMENT \
            GITHUB_AUTH_SECRET_NAME DB_SECRET_NAME PROD_NAMESPACE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing live E2E configuration: ${missing[*]}"
            exit 1
          fi

      - name: Deploy PR head to isolated E2E namespace
        run: make e2e-azure-route-up

      - name: Install Playwright Chromium
        run: make playwright-install

      - name: Run live Playwright platform flows
        run: |
          set -euo pipefail
          ns="$(sed -n 's/^NS=//p' "$E2E_METADATA_FILE")"
          base_url="$(sed -n 's/^URL=//p' "$E2E_METADATA_FILE")"
          session_secret="$(
            kubectl -n "$ns" get "secret/$GITHUB_AUTH_SECRET_NAME" \
              -o jsonpath='{.data.auth-session-secret}' |
              base64 --decode
          )"
          if [[ -z "$ns" || -z "$base_url" || -z "$session_secret" ]]; then
            echo "E2E metadata or auth session secret is missing."
            exit 1
          fi
          export LIVE_E2E_BASE_URL="$base_url"
          export LIVE_E2E_AUTH_SESSION_SECRET="$session_secret"
          make test-e2e-live
          unset LIVE_E2E_AUTH_SESSION_SECRET session_secret

      - name: Add live E2E result summary
        if: always()
        run: |
          if [[ -f "$LIVE_E2E_ARTIFACT_DIR/results.json" ]]; then
            echo "### Live Playwright E2E" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$LIVE_E2E_ARTIFACT_DIR/results.json" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live E2E artifacts
        if: always()
        # v4.6.2
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-e2e-pr-${{ github.event.number }}
          path: ${{ env.LIVE_E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary E2E namespace
        if: always()
        run: |
          if [[ -f "$E2E_METADATA_FILE" ]]; then
            make e2e-azure-route-down
          fi

  ci-gate:
    if: always()
    permissions:
      contents: read
      statuses: read
    needs:
      - tag-mainline-check
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
      - free-e2e
      - live-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TAG_MAINLINE_RESULT: ${{ needs.tag-mainline-check.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
          LINT_RESULT: ${{ needs.lint-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          INTEGRATION_MSSQL_RESULT: ${{ needs.integration-test-mssql.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          HELM_RESULT: ${{ needs.helm-validate.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          FREE_E2E_RESULT: ${{ needs.free-e2e.result }}
          LIVE_E2E_RESULT: ${{ needs.live-e2e.result }}
          # Unset by default, which is what keeps the Azure-backed live-e2e
          # job skipped and out of the merge decision.
          LIVE_E2E_ENABLED: ${{ vars.LIVE_E2E_ENABLED }}
          # Likewise unset by default. dependabot-e2e deploys to the same dead
          # AKS cluster, so its status can never reach success and polling for
          # it would freeze every bot PR for 70 minutes. The whole path is
          # deleted in a follow-up; the variable keeps it recoverable until
          # then.
          DEPENDABOT_E2E_ENABLED: ${{ vars.DEPENDABOT_E2E_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          IS_DEPENDABOT: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.user.login == 'dependabot[bot]' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=false
          failed_jobs=()

          echo "CI job results:"
          echo "  tag-mainline-check:         ${TAG_MAINLINE_RESULT}"
          echo "  changes:                    ${CHANGES_RESULT}"
          echo "  docs-only change:           ${DOCS_ONLY}"
          echo "  run integration suites:     ${RUN_INTEGRATION}"
          echo "  lint-typecheck:             ${LINT_RESULT}"
          echo "  test:                       ${TEST_RESULT}"
          echo "  integration-test:           ${INTEGRATION_RESULT}"
          echo "  integration-test-mssql:     ${INTEGRATION_MSSQL_RESULT}"
          echo "  security:                   ${SECURITY_RESULT}"
          echo "  helm-validate:              ${HELM_RESULT}"
          echo "  docker-build:               ${DOCKER_RESULT}"
          echo "  run browser e2e:            ${RUN_E2E}"
          echo "  free-e2e:                   ${FREE_E2E_RESULT}"
          echo "  live-e2e enabled:           ${LIVE_E2E_ENABLED:-false}"
          echo "  dependabot-e2e enabled:     ${DEPENDABOT_E2E_ENABLED:-false}"
          echo "  live-e2e:                   ${LIVE_E2E_RESULT}"

          for name_result in \
            "tag-mainline-check:${TAG_MAINLINE_RESULT}" \
            "changes:${CHANGES_RESULT}" \
            "lint-typecheck:${LINT_RESULT}" \
            "test:${TEST_RESULT}" \
            "security:${SECURITY_RESULT}" \
            "helm-validate:${HELM_RESULT}" \
            "docker-build:${DOCKER_RESULT}"; do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            if [[ "$result" != "success" ]]; then
              failed=true
              failed_jobs+=("${name} (${result})")
            fi
          done

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${IS_DEPENDABOT}" == "true" &&
                  "${DEPENDABOT_E2E_ENABLED}" == "true" ]]; then
              # Dependabot E2E runs claim a namespace from a fixed-size pool
              # and a single run takes ~20 minutes, so once every slot is busy
              # the wait has to cover a queue of PRs, not a single run.
              dependabot_e2e_state=""
              for _ in $(seq 1 210); do
                dependabot_e2e_state="$(
                  gh api \
                    "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/status" \
                    --jq '
                      [
                        .statuses[] |
                        select(.context == "dependabot-e2e")
                      ] |
                      sort_by(.created_at) |
                      last |
                      .state // ""
                    '
                )"
                case "${dependabot_e2e_state}" in
                  success)
                    break
                    ;;
                  failure|error)
                    break
                    ;;
                esac
                sleep 20
              done
              if [[ "${dependabot_e2e_state}" != "success" ]]; then
                failed=true
                failed_jobs+=(
                  "dependabot-e2e (${dependabot_e2e_state:-missing})"
                )
                case "${dependabot_e2e_state}" in
                  ""|pending)
                    echo ""
                    echo "The dependabot-e2e status never reached a terminal" \
                      "state within the wait window."
                    echo "This usually means every namespace in the" \
                      "Dependabot E2E pool was busy, so the run could not" \
                      "claim a slot. Check DEPENDABOT_E2E_NAMESPACE_POOL and" \
                      "whether the pool is large enough for the number of" \
                      "open Dependabot PRs."
                    echo "It is not evidence that this dependency update is" \
                      "broken. Re-run 'Dependabot E2E Build' for this PR once" \
                      "the pool has capacity."
                    ;;
                esac
              fi
            fi

            # free-e2e gates Dependabot PRs too, so this is a separate `if`
            # rather than another arm of the chain above. With
            # DEPENDABOT_E2E_ENABLED unset the free k3d gate is the only
            # browser gate a bot PR has to satisfy; set it to 'true' and the
            # pooled AKS status has to be green as well.
            if [[ "${RUN_E2E}" == "false" ]]; then
              echo "Browser E2E intentionally skipped (inert docs/repo-meta" \
                "change)."
            else
              if [[ "${FREE_E2E_RESULT}" != "success" ]]; then
                failed=true
                failed_jobs+=("free-e2e (${FREE_E2E_RESULT})")
              fi
              # live-e2e is opt-in: without vars.LIVE_E2E_ENABLED the job is
              # skipped, and a skipped job must not block the merge.
              if [[ "${LIVE_E2E_ENABLED}" == "true" &&
                    "${LIVE_E2E_RESULT}" != "success" ]]; then
                failed=true
                failed_jobs+=("live-e2e (${LIVE_E2E_RESULT})")
              fi
            fi
          else
            echo "Browser E2E is required for pull requests only."
          fi

          if [[ "${RUN_INTEGRATION}" == "true" ]]; then
            for name_result in \
              "integration-test:${INTEGRATION_RESULT}" \
              "integration-test-mssql:${INTEGRATION_MSSQL_RESULT}"; do
              name="${name_result%%:*}"
              result="${name_result#*:}"
              if [[ "$result" != "success" ]]; then
                failed=true
                failed_jobs+=("${name} (${result})")
              fi
            done
          else
            echo "Integration suites intentionally skipped (docs-only change)."
          fi

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "Failed jobs:"
            for job in "${failed_jobs[@]}"; do
              echo "  - ${job}"
            done
            exit 1
          fi
          echo "All CI jobs passed."

  update-coverage-badge:
    runs-on: ubuntu-latest
    needs:
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Run backend tests with coverage
        run: make test

      - name: Generate coverage badge
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          mkdir -p badges
          coverage_label="${coverage_value}%25"
          badge_url="https://img.shields.io/badge/coverage-"
          badge_url+="${coverage_label}-${color}.svg"
          curl -fsSL "$badge_url" -o badges/coverage.svg

      - name: Commit updated coverage badge
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge is already up to date."
            exit 0
          fi
          git add badges/coverage.svg
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(ci): update coverage badge [skip ci]"
          push_output="$(mktemp)"
          if git push origin HEAD:main >"${push_output}" 2>&1; then
            rm -f "${push_output}"
            exit 0
          fi
          if grep -Eiq \
            '(protected branch|GH006|repository rule violations|ruleset)' \
            "${push_output}"; then
            echo "::warning::Coverage badge push blocked by repository rules."
            echo "::warning::Skipping badge update push on protected main."
            cat "${push_output}"
            rm -f "${push_output}"
            exit 0
          fi
          echo "::error::Failed to push updated coverage badge."
          cat "${push_output}"
          rm -f "${push_output}"
          exit 1
