---
name: CI

"on":
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  direct-push-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Flag direct push to main
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "::warning::Direct push to main detected — use a PR instead."
          echo "Pushed by: ${ACTOR} (${SHA})"

  tag-mainline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Verify semver tag ancestry
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "Not a push event; skipping tag ancestry check."
            exit 0
          fi
          if [[ ! "${REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semver tag push; skipping tag ancestry check."
            exit 0
          fi

          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${SHA}" "origin/main"; then
            echo "Tag ${REF} points to ${SHA}, outside main history."
            echo "Release tags must be created from main."
            exit 1
          fi
          echo "Tag commit is on main history."

      - name: Verify semver surfaces for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-version-sync.mjs verify --tag "${RELEASE_TAG}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      run_integration: ${{ steps.detect.outputs.run_integration }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
          fi

          # Fall back to running integration if diff endpoints are unavailable.
          if [[ -z "${base_sha}" ]] || [[ "${base_sha}" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "Unable to determine diff base; running integration tests." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Use merge-base diff for PRs to ignore unrelated base-only commits.
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}...${head_sha}"
            )
          else
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}" "${head_sha}"
            )
          fi

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running integration tests." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docs_only=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.md|*.mdx|docs/*)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          if [[ "${docs_only}" == "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "run_integration=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected; integration suites skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "Code-related change detected; integration suites enabled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Setup Bun
        # v2.2.0
        uses: >-
          oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Ensure SHA-pinned actions
        # v5.0.3
        uses: >-
          zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9

      - name: Install dependencies
        run: make install

      - name: Validate (lint + typecheck)
        run: make validate

      - name: Check unused exports (hygiene, non-blocking)
        continue-on-error: true
        run: make lint-unused-exports

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Setup Bun
        # v2.2.0
        uses: >-
          oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make test

      - name: Compute coverage metadata
        id: coverage
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          echo "value=${coverage_value}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          summary_line="- Backend line coverage: ${coverage_value}%"
          echo "$summary_line" >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Setup Bun
        # v2.2.0
        uses: >-
          oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Run integration tests (mock mode)
        run: make test-integration

  integration-test-mssql:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: ${{ format('CiRun{0}!aA', github.run_id) }}
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd
          "python3 -c \"import socket; s=socket.socket();
          s.settimeout(2); s.connect(('localhost',1433)); s.close()\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Setup Bun
        # v2.2.0
        uses: >-
          oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Create sresimulator database
        working-directory: backend
        env:
          DB_CONN: >-
            Server=localhost;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};
            TrustServerCertificate=true
        run: |
          node -e "
            const sql = require('mssql');
            const q = 'IF DB_ID('+
              String.fromCharCode(39)+
              'sresimulator'+
              String.fromCharCode(39)+
              ') IS NULL CREATE DATABASE sresimulator';
            sql.connect(process.env.DB_CONN)
              .then(p => p.request().query(q)
                .then(() => p.close()))
              .then(() => process.exit(0))
              .catch(e => {
                console.error(e.message);
                process.exit(1);
              });
          "

      - name: Run MSSQL integration tests
        env:
          STORAGE_BACKEND: mssql
          DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make test-integration

      - name: Smoke startup with MSSQL backend
        env:
          MSSQL_DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make smoke-backend-mssql

  security:
    runs-on: ubuntu-latest
    env:
      SECURITY_FAIL_LEVEL: high
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Setup Bun
        # v2.2.0
        uses: >-
          oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: make install

      - name: Resolve daily Grype cache key
        id: grype-cache-key
        run: >-
          echo "key=grype-${RUNNER_OS}-v0.110.0-$(date -u +%Y-%m-%d)"
          >> "$GITHUB_OUTPUT"

      - name: Restore Grype vulnerability database
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/grype
          key: ${{ steps.grype-cache-key.outputs.key }}
          restore-keys: |
            grype-${{ runner.os }}-v0.110.0-

      - name: Security checks
        run: make security

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Helm lint
        run: helm lint ./helm/sre-simulator

      - name: Helm lint (generic profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm lint (ARO AI profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-aro-ai-live.example.yaml

      - name: Helm template (Route mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml

      - name: Helm template (Ingress mode via generic profile)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm template (legacy route toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=true \
            --set ingress.enabled=false

      - name: Helm template (legacy ingress toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=false \
            --set ingress.enabled=true \
            --set exposure.host=ingress.example.test

      - name: Helm template (AKS Gateway mode)
        run: bash scripts/helm-render-gateway.sh

      - name: Helm template (AKS publicService mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode=publicService \
            --set exposure.host=aks.example.test \
            --set exposure.scheme=http \
            --set frontend.service.public.loadBalancerIP=203.0.113.10 \
            --set frontend.autoscaling.enabled=true \
            --set frontend.autoscaling.minReplicas=1 \
            --set frontend.autoscaling.maxReplicas=3 \
            --set backend.autoscaling.enabled=true \
            --set backend.autoscaling.minReplicas=1 \
            --set backend.autoscaling.maxReplicas=4 \
            --set database.enabled=true \
            --set database.existingSecretName=sre-sql-creds

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load Bun version
        run: |
          set -euo pipefail
          if [ ! -s .bun-version ]; then
            echo "BUN_VERSION is required;" >&2
            echo ".bun-version is missing or empty." >&2
            exit 1
          fi
          version="$(tr -d '\n' < .bun-version)"
          echo "BUN_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build Docker image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          COMPONENT: ${{ matrix.component }}
        run: >-
          docker build
          --build-arg BUN_VERSION="${BUN_VERSION}"
          -f "${DOCKERFILE}"
          -t "sre-simulator-${COMPONENT}"
          .

  live-e2e:
    needs:
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      needs.lint-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.helm-validate.result == 'success' &&
      needs.docker-build.result == 'success' &&
      (
        needs.changes.outputs.run_integration != 'true' ||
        (
          needs.integration-test.result == 'success' &&
          needs.integration-test-mssql.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: live-e2e
    concurrency:
      group: sresimulator-live-e2e-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      CLUSTER_FLAVOR: aks
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_RG: ${{ secrets.AKS_RG }}
      AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}
      AOAI_RG: ${{ secrets.AOAI_RG }}
      AOAI_ACCOUNT: ${{ secrets.AOAI_ACCOUNT }}
      AOAI_DEPLOYMENT: ${{ secrets.AOAI_DEPLOYMENT }}
      AOAI_DEPLOYMENT_CHAT: ${{ secrets.AOAI_DEPLOYMENT_CHAT }}
      AOAI_DEPLOYMENT_COMMAND: ${{ secrets.AOAI_DEPLOYMENT_COMMAND }}
      AOAI_DEPLOYMENT_SCENARIO: ${{ secrets.AOAI_DEPLOYMENT_SCENARIO }}
      AOAI_DEPLOYMENT_PROBE: ${{ secrets.AOAI_DEPLOYMENT_PROBE }}
      GITHUB_AUTH_SECRET_NAME: >-
        ${{
          vars.AUTH_SECRET_NAME ||
          secrets.AUTH_SECRET_NAME ||
          vars.GITHUB_AUTH_SECRET_NAME ||
          secrets.GITHUB_AUTH_SECRET_NAME ||
          'sre-auth-secrets'
        }}
      AUTH_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      DB_SECRET_NAME: ${{ secrets.DB_SECRET_NAME }}
      DB_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      PROD_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      E2E_NAMESPACE_PREFIX: sre-pr-${{ github.event.number }}
      E2E_METADATA_FILE: data/live-e2e-${{ github.event.number }}.env
      E2E_RELEASE: sre-simulator
      AKS_E2E_EXPOSURE_MODE: none
      AKS_E2E_PUSH_DEV_IMAGES: "true"
      # Reuse the previous push's image layers instead of reinstalling
      # node_modules and rebuilding the frontend bundle every time. The deploy
      # step spent 116 of its 196 seconds rebuilding images that had not
      # changed.
      AKS_E2E_IMAGE_CACHE: "true"
      AKS_E2E_DEV_IMAGE_TAG_SUFFIX: dev
      GHCR_USERNAME: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
      TURNSTILE_TEST_MODE: "true"
      LOCAL_TEST_VERIFICATION_ENABLED: "true"
      LIVE_E2E_ARTIFACT_DIR: >-
        data/playwright-live-e2e-${{ github.event.number }}
      LIVE_E2E_VIEWER_PREFIX: >-
        pr-${{ github.event.number }}-${{ github.run_id }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Setup Bun
        # v2.2.0
        uses: >-
          oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: make install

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Azure login
        # v3.0.0
        uses: >-
          azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate privileged E2E configuration
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_SUBSCRIPTION_ID AKS_RG AKS_CLUSTER \
            AOAI_RG AOAI_ACCOUNT AOAI_DEPLOYMENT \
            GITHUB_AUTH_SECRET_NAME DB_SECRET_NAME PROD_NAMESPACE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing live E2E configuration: ${missing[*]}"
            exit 1
          fi

      - name: Deploy PR head to isolated E2E namespace
        run: make e2e-azure-route-up

      - name: Install Playwright Chromium
        run: make playwright-install

      - name: Run live Playwright platform flows
        run: |
          set -euo pipefail
          ns="$(sed -n 's/^NS=//p' "$E2E_METADATA_FILE")"
          base_url="$(sed -n 's/^URL=//p' "$E2E_METADATA_FILE")"
          session_secret="$(
            kubectl -n "$ns" get "secret/$GITHUB_AUTH_SECRET_NAME" \
              -o jsonpath='{.data.auth-session-secret}' |
              base64 --decode
          )"
          if [[ -z "$ns" || -z "$base_url" || -z "$session_secret" ]]; then
            echo "E2E metadata or auth session secret is missing."
            exit 1
          fi
          export LIVE_E2E_BASE_URL="$base_url"
          export LIVE_E2E_AUTH_SESSION_SECRET="$session_secret"
          make test-e2e-live
          unset LIVE_E2E_AUTH_SESSION_SECRET session_secret

      - name: Add live E2E result summary
        if: always()
        run: |
          if [[ -f "$LIVE_E2E_ARTIFACT_DIR/results.json" ]]; then
            echo "### Live Playwright E2E" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$LIVE_E2E_ARTIFACT_DIR/results.json" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live E2E artifacts
        if: always()
        # v4.6.2
        uses: >-
          actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-e2e-pr-${{ github.event.number }}
          path: ${{ env.LIVE_E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary E2E namespace
        if: always()
        run: |
          if [[ -f "$E2E_METADATA_FILE" ]]; then
            make e2e-azure-route-down
          fi

  ci-gate:
    if: always()
    permissions:
      contents: read
      statuses: read
    needs:
      - tag-mainline-check
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
      - live-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TAG_MAINLINE_RESULT: ${{ needs.tag-mainline-check.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          LINT_RESULT: ${{ needs.lint-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          INTEGRATION_MSSQL_RESULT: ${{ needs.integration-test-mssql.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          HELM_RESULT: ${{ needs.helm-validate.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          LIVE_E2E_RESULT: ${{ needs.live-e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_DEPENDABOT: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.user.login == 'dependabot[bot]' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=false
          failed_jobs=()

          echo "CI job results:"
          echo "  tag-mainline-check:         ${TAG_MAINLINE_RESULT}"
          echo "  changes:                    ${CHANGES_RESULT}"
          echo "  docs-only change:           ${DOCS_ONLY}"
          echo "  run integration suites:     ${RUN_INTEGRATION}"
          echo "  lint-typecheck:             ${LINT_RESULT}"
          echo "  test:                       ${TEST_RESULT}"
          echo "  integration-test:           ${INTEGRATION_RESULT}"
          echo "  integration-test-mssql:     ${INTEGRATION_MSSQL_RESULT}"
          echo "  security:                   ${SECURITY_RESULT}"
          echo "  helm-validate:              ${HELM_RESULT}"
          echo "  docker-build:               ${DOCKER_RESULT}"
          echo "  live-e2e:                   ${LIVE_E2E_RESULT}"

          for name_result in \
            "tag-mainline-check:${TAG_MAINLINE_RESULT}" \
            "changes:${CHANGES_RESULT}" \
            "lint-typecheck:${LINT_RESULT}" \
            "test:${TEST_RESULT}" \
            "security:${SECURITY_RESULT}" \
            "helm-validate:${HELM_RESULT}" \
            "docker-build:${DOCKER_RESULT}"; do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            if [[ "$result" != "success" ]]; then
              failed=true
              failed_jobs+=("${name} (${result})")
            fi
          done

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${IS_DEPENDABOT}" == "true" ]]; then
              # Dependabot E2E runs claim a namespace from a fixed-size pool
              # and a single run takes ~20 minutes, so once every slot is busy
              # the wait has to cover a queue of PRs, not a single run.
              dependabot_e2e_state=""
              for _ in $(seq 1 210); do
                dependabot_e2e_state="$(
                  gh api \
                    "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/status" \
                    --jq '
                      [
                        .statuses[] |
                        select(.context == "dependabot-e2e")
                      ] |
                      sort_by(.created_at) |
                      last |
                      .state // ""
                    '
                )"
                case "${dependabot_e2e_state}" in
                  success)
                    break
                    ;;
                  failure|error)
                    break
                    ;;
                esac
                sleep 20
              done
              if [[ "${dependabot_e2e_state}" != "success" ]]; then
                failed=true
                failed_jobs+=(
                  "dependabot-e2e (${dependabot_e2e_state:-missing})"
                )
                case "${dependabot_e2e_state}" in
                  ""|pending)
                    echo ""
                    echo "The dependabot-e2e status never reached a terminal" \
                      "state within the wait window."
                    echo "This usually means every namespace in the" \
                      "Dependabot E2E pool was busy, so the run could not" \
                      "claim a slot. Check DEPENDABOT_E2E_NAMESPACE_POOL and" \
                      "whether the pool is large enough for the number of" \
                      "open Dependabot PRs."
                    echo "It is not evidence that this dependency update is" \
                      "broken. Re-run 'Dependabot E2E Build' for this PR once" \
                      "the pool has capacity."
                    ;;
                esac
              fi
            elif [[ "${LIVE_E2E_RESULT}" != "success" ]]; then
              failed=true
              failed_jobs+=("live-e2e (${LIVE_E2E_RESULT})")
            fi
          else
            echo "Live E2E is required for pull requests only."
          fi

          if [[ "${RUN_INTEGRATION}" == "true" ]]; then
            for name_result in \
              "integration-test:${INTEGRATION_RESULT}" \
              "integration-test-mssql:${INTEGRATION_MSSQL_RESULT}"; do
              name="${name_result%%:*}"
              result="${name_result#*:}"
              if [[ "$result" != "success" ]]; then
                failed=true
                failed_jobs+=("${name} (${result})")
              fi
            done
          else
            echo "Integration suites intentionally skipped (docs-only change)."
          fi

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "Failed jobs:"
            for job in "${failed_jobs[@]}"; do
              echo "  - ${job}"
            done
            exit 1
          fi
          echo "All CI jobs passed."

  update-coverage-badge:
    runs-on: ubuntu-latest
    needs:
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - security
      - helm-validate
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v6.3.0
        uses: >-
          actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Setup Bun
        # v2.2.0
        uses: >-
          oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        # v4.2.4
        uses: >-
          actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: make install

      - name: Run backend tests with coverage
        run: make test

      - name: Generate coverage badge
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          mkdir -p badges
          coverage_label="${coverage_value}%25"
          badge_url="https://img.shields.io/badge/coverage-"
          badge_url+="${coverage_label}-${color}.svg"
          curl -fsSL "$badge_url" -o badges/coverage.svg

      - name: Commit updated coverage badge
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge is already up to date."
            exit 0
          fi
          git add badges/coverage.svg
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(ci): update coverage badge [skip ci]"
          push_output="$(mktemp)"
          if git push origin HEAD:main >"${push_output}" 2>&1; then
            rm -f "${push_output}"
            exit 0
          fi
          if grep -Eiq \
            '(protected branch|GH006|repository rule violations|ruleset)' \
            "${push_output}"; then
            echo "::warning::Coverage badge push blocked by repository rules."
            echo "::warning::Skipping badge update push on protected main."
            cat "${push_output}"
            rm -f "${push_output}"
            exit 0
          fi
          echo "::error::Failed to push updated coverage badge."
          cat "${push_output}"
          rm -f "${push_output}"
          exit 1
