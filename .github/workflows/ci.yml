---
name: CI

"on":
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  direct-push-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Flag direct push to main
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "::warning::Direct push to main detected — use a PR instead."
          echo "Pushed by: ${ACTOR} (${SHA})"

  tag-mainline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # v6.3.0
        uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Verify semver tag ancestry
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "Not a push event; skipping tag ancestry check."
            exit 0
          fi
          if [[ ! "${REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semver tag push; skipping tag ancestry check."
            exit 0
          fi

          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${SHA}" "origin/main"; then
            echo "Tag ${REF} points to ${SHA}, outside main history."
            echo "Release tags must be created from main."
            exit 1
          fi
          echo "Tag commit is on main history."

      - name: Verify semver surfaces for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-version-sync.mjs verify --tag "${RELEASE_TAG}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      run_integration: ${{ steps.detect.outputs.run_integration }}
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
          fi

          # Fall back to running integration if diff endpoints are unavailable.
          if [[ -z "${base_sha}" ]] || [[ "${base_sha}" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Unable to determine diff base; running integration and E2E." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Use merge-base diff for PRs to ignore unrelated base-only commits.
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}...${head_sha}"
            )
          else
            mapfile -t changed_files < <(
              git diff --name-only "${base_sha}" "${head_sha}"
            )
          fi

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running integration and E2E." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # docs_only skips the (cheap) integration suites. e2e_exempt also
          # skips the expensive, manually-approved live-e2e cluster gate. Both
          # are strict positive allowlists: any file outside the allowlist
          # forces the corresponding suite to run (fail-safe default). The e2e
          # allowlist is a superset of docs (it additionally permits inert
          # repo-meta files such as .gitignore) because those can never affect
          # runtime, build, or deploy behavior and so cannot change an E2E
          # outcome. Anything that can — source, .github/**, scripts/**,
          # helm/**, infra/**, Dockerfiles, package/lock files, Makefile — is
          # unlisted and therefore always runs the live gate.
          #
          # knowledge_base/*.md is deliberately NOT e2e-exempt: those markdown
          # files are loaded into the live AI context, so a change there can
          # alter real model output. live-e2e (real AI) is the only gate that
          # exercises that path — the integration suites run on mock AI — so a
          # knowledge_base edit must always run the live gate even though it is
          # still docs_only for the mock-AI integration suites.
          #
          # Note: these are `case` patterns, not filename globs. In a `case`
          # (and `[[ ==` ]]) the `*` wildcard matches `/`, so `docs/*` and
          # `knowledge_base/*` already cover arbitrarily nested paths (e.g.
          # docs/superpowers/deep/guide.md, knowledge_base/aro/x/y.md). Do NOT
          # rewrite these into a filename-expansion context (globstar, `for f
          # in docs/*`) where `*` stops at `/` — that would silently narrow the
          # match to a single segment and break the nested-path coverage.
          docs_only=true
          e2e_exempt=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.md|*.mdx|docs/*)
                ;;
              *)
                docs_only=false
                ;;
            esac
            case "$file" in
              knowledge_base/*)
                e2e_exempt=false
                ;;
              *.md|*.mdx|docs/*|.gitignore|.gitattributes|LICENSE*|.editorconfig)
                ;;
              *)
                e2e_exempt=false
                ;;
            esac
          done

          if [[ "${docs_only}" == "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "run_integration=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected; integration suites skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "Code-related change detected; integration suites enabled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${e2e_exempt}" == "true" ]]; then
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Inert change (docs/repo-meta only); live E2E skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Runtime-relevant change; live E2E enabled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Ensure SHA-pinned actions
        # v5.0.3
        uses: >-
          zgosalvez/github-actions-ensure-sha-pinned-actions@c5fc58bd0be7a4b94b73ce40250322d5b838a108

      - name: Install dependencies
        run: make install

      - name: Validate (lint + typecheck)
        run: make validate

      - name: Check unused exports (hygiene, non-blocking)
        continue-on-error: true
        run: make lint-unused-exports

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make test

      - name: Compute coverage metadata
        id: coverage
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          echo "value=${coverage_value}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          summary_line="- Backend line coverage: ${coverage_value}%"
          echo "$summary_line" >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # `make test-integration` depends on `make test-shell`, which runs
          # every scripts/*.test.sh in the PR's own tree -- PR-authored shell,
          # with network access, as the runner's own user. Left at the
          # default, checkout leaves this job's GITHUB_TOKEN in .git/config,
          # so one of those scripts could read and send it. The `env -i` on
          # each invocation is no defence: it clears the environment, and the
          # token is on disk.
          #
          # Nothing in this job talks to git after the checkout, so removing
          # the credential costs it nothing.
          persist-credentials: false

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Run integration tests (mock mode)
        run: make test-integration

  integration-test-mssql:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: ${{ format('CiRun{0}!aA', github.run_id) }}
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd
          "python3 -c \"import socket; s=socket.socket();
          s.settimeout(2); s.connect(('localhost',1433)); s.close()\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # `make test-integration` depends on `make test-shell`, which runs
          # every scripts/*.test.sh in the PR's own tree -- PR-authored shell,
          # with network access, as the runner's own user. Left at the
          # default, checkout leaves this job's GITHUB_TOKEN in .git/config,
          # so one of those scripts could read and send it. The `env -i` on
          # each invocation is no defence: it clears the environment, and the
          # token is on disk.
          #
          # Nothing in this job talks to git after the checkout, so removing
          # the credential costs it nothing.
          persist-credentials: false

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Create sresimulator database
        working-directory: backend
        env:
          DB_CONN: >-
            Server=localhost;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};
            TrustServerCertificate=true
        run: |
          node -e "
            const sql = require('mssql');
            const q = 'IF DB_ID('+
              String.fromCharCode(39)+
              'sresimulator'+
              String.fromCharCode(39)+
              ') IS NULL CREATE DATABASE sresimulator';
            sql.connect(process.env.DB_CONN)
              .then(p => p.request().query(q)
                .then(() => p.close()))
              .then(() => process.exit(0))
              .catch(e => {
                console.error(e.message);
                process.exit(1);
              });
          "

      - name: Run MSSQL integration tests
        env:
          STORAGE_BACKEND: mssql
          DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make test-integration

      - name: Smoke startup with MSSQL backend
        env:
          MSSQL_DATABASE_URL: >-
            Server=localhost;Database=sresimulator;User Id=sa;
            Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true
        run: make smoke-backend-mssql

  integration-test-postgres:
    needs:
      - changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    env:
      # No punctuation: the value is interpolated into a URL userinfo field,
      # where a reserved character would have to be percent-encoded in every
      # consumer below.
      POSTGRES_PASSWORD: ${{ format('ciRun{0}aA', github.run_id) }}
      POSTGRES_USER: sresimulator
      POSTGRES_DB: sresimulator
    services:
      # POSTGRES_DB creates the database on first start, so this job needs no
      # equivalent of the MSSQL job's "Create sresimulator database" step.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sresimulator -d sresimulator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install backend dependencies
        run: make install-backend

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Run Postgres integration tests
        env:
          STORAGE_BACKEND: postgres
          # Folded scalars join lines with a SPACE, which would corrupt a URL.
          # The break sits inside the ${{ }} braces, where a space is legal
          # expression syntax; do not move it outside them.
          DATABASE_URL: >-
            postgres://sresimulator:${{ env.POSTGRES_PASSWORD
            }}@localhost:5432/sresimulator
        run: make test-integration

      - name: Smoke startup with Postgres backend
        env:
          POSTGRES_DATABASE_URL: >-
            postgres://sresimulator:${{ env.POSTGRES_PASSWORD
            }}@localhost:5432/sresimulator
        run: make smoke-backend-postgres

  security:
    runs-on: ubuntu-latest
    env:
      SECURITY_FAIL_LEVEL: high
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Resolve daily Grype cache key
        id: grype-cache-key
        run: >-
          echo "key=grype-${RUNNER_OS}-v0.110.0-$(date -u +%Y-%m-%d)"
          >> "$GITHUB_OUTPUT"

      - name: Restore Grype vulnerability database
        # v4.2.4
        uses: >-
          actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/grype
          key: ${{ steps.grype-cache-key.outputs.key }}
          restore-keys: |
            grype-${{ runner.os }}-v0.110.0-

      - name: Security checks
        run: make security

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Helm lint
        run: helm lint ./helm/sre-simulator

      - name: Helm lint (generic profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm lint (ARO AI profile)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-aro-ai-live.example.yaml

      - name: Helm lint (OCI free-tier profile)
        run: |
          set -euo pipefail
          # The profile ships a placeholder host and a live ACME resolver, and
          # the chart refuses that pair on purpose, so lint has to supply the
          # hostname the same way a real deploy does.
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-oci.yaml \
            --set exposure.host=sre-simulator.invalid-placeholder.dev

      - name: Helm lint (OCI free-tier profile + CI k3d overlay)
        run: |
          set -euo pipefail
          helm lint ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-oci.yaml \
            --values ./helm/sre-simulator/values-ci-k3d.yaml

      - name: Helm template (Route mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml

      - name: Helm template (Ingress mode via generic profile)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-generic.yaml

      - name: Helm template (OCI free-tier profile)
        run: |
          set -euo pipefail
          oci_host=sre-simulator.invalid-placeholder.dev
          rendered="$(
            helm template sre-simulator ./helm/sre-simulator \
              --values ./helm/sre-simulator/values.yaml \
              --values ./helm/sre-simulator/values-oci.yaml \
              --set "exposure.host=${oci_host}"
          )"
          # Traefik terminates TLS with its own ACME resolver, so the router
          # annotations are the whole TLS story for this profile: no
          # Kubernetes Secret, no ingress.tls block.
          for annotation in \
            "traefik.ingress.kubernetes.io/router.entrypoints: websecure" \
            "traefik.ingress.kubernetes.io/router.tls: \"true\"" \
            "traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt"
          do
            if ! grep -Fq -- "${annotation}" <<<"${rendered}"; then
              echo "::error::OCI profile did not render ${annotation}"
              exit 1
            fi
          done

          # The single-node replica pins. Checked HPA-first because the two
          # are coupled: turning autoscaling on makes the Deployment omit
          # `replicas` altogether, so a bare `replicas: 1` grep would report
          # the pin as missing rather than saying why it went. Both checks
          # stay -- the HPA one also catches a future template that adds an
          # autoscaler without touching the existing conditional.
          if grep -Fq -- "kind: HorizontalPodAutoscaler" <<<"${rendered}"; then
            echo "::error::OCI profile must not render an HPA: one node, and" \
              "the backend's in-memory AI budget store is per-process"
            exit 1
          fi
          for component in backend frontend; do
            component_rendered="$(
              helm template sre-simulator ./helm/sre-simulator \
                --values ./helm/sre-simulator/values.yaml \
                --values ./helm/sre-simulator/values-oci.yaml \
                --set "exposure.host=${oci_host}" \
                --show-only "templates/${component}-deployment.yaml"
            )"
            # Anchored: an unanchored match also accepts `minReplicas: 1`.
            if ! grep -Eq '^  replicas: 1$' <<<"${component_rendered}"; then
              echo "::error::OCI profile must pin ${component} to replicas: 1"
              exit 1
            fi
          done

          # The profile has no deployable storage backend yet: database.enabled
          # is false, so the backend renders no STORAGE_BACKEND, defaults to
          # json, and initStorage() refuses json in a pod unless the test-only
          # ALLOW_DEPLOYED_JSON_STORAGE_FOR_TESTS + AI_MOCK_MODE pair is set --
          # which free-e2e sets and a real deploy must not. Saying so in the
          # file is the honest fix, but a comment drifts, so this holds the
          # notice and the render in step in both directions: it fails if the
          # notice goes while the render is still JSON-only, and it fails if
          # the profile gains a backend and the stale notice stays.
          backend_rendered="$(
            helm template sre-simulator ./helm/sre-simulator \
              --values ./helm/sre-simulator/values.yaml \
              --values ./helm/sre-simulator/values-oci.yaml \
              --set "exposure.host=${oci_host}" \
              --show-only "templates/backend-deployment.yaml"
          )"
          renders_backend=false
          if grep -Eq '^ +- name: STORAGE_BACKEND$' <<<"${backend_rendered}"
          then
            renders_backend=true
          fi
          carries_notice=false
          if grep -Fq -- "NOT A COMPLETE DEPLOY PROFILE" \
            ./helm/sre-simulator/values-oci.yaml; then
            carries_notice=true
          fi
          if [[ "${renders_backend}" == "false" \
            && "${carries_notice}" == "false" ]]; then
            echo "::error::OCI profile renders no STORAGE_BACKEND, so a real" \
              "deploy crashloops on initStorage(). Restore the render-only" \
              "notice in values-oci.yaml or give the profile a backend."
            exit 1
          fi
          if [[ "${renders_backend}" == "true" \
            && "${carries_notice}" == "true" ]]; then
            echo "::error::OCI profile now renders a STORAGE_BACKEND but" \
              "still calls itself render-only. Drop the notice from" \
              "values-oci.yaml."
            exit 1
          fi

          # The guard that makes the placeholder host safe to ship. Without
          # this, the profile could quietly go back to requesting an ACME
          # certificate for a domain the deployment does not own.
          if helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-oci.yaml >/dev/null 2>&1
          then
            echo "::error::OCI profile must refuse to render its placeholder" \
              "host while a cert resolver is set"
            exit 1
          fi

      - name: Helm template (OCI free-tier profile + CI k3d overlay)
        run: |
          set -euo pipefail
          rendered="$(
            helm template sre-simulator ./helm/sre-simulator \
              --values ./helm/sre-simulator/values.yaml \
              --values ./helm/sre-simulator/values-oci.yaml \
              --values ./helm/sre-simulator/values-ci-k3d.yaml
          )"
          # An unsatisfiable HTTP-01 challenge inside k3d would leave the
          # router without a certificate and fail every request, so the CI
          # overlay must clear the cert resolver entirely.
          if grep -Fq -- "traefik.ingress.kubernetes.io/router.tls" \
            <<<"${rendered}"; then
            echo "::error::CI k3d overlay must not request ACME TLS"
            exit 1
          fi

      - name: Helm template (legacy route toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=true \
            --set ingress.enabled=false

      - name: Helm template (legacy ingress toggle)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode= \
            --set route.enabled=false \
            --set ingress.enabled=true \
            --set exposure.host=ingress.example.test

      - name: Helm template (AKS Gateway mode)
        run: bash scripts/helm-render-gateway.sh

      - name: Helm template (AKS publicService mode)
        run: |
          set -euo pipefail
          helm template sre-simulator ./helm/sre-simulator \
            --values ./helm/sre-simulator/values.yaml \
            --set exposure.mode=publicService \
            --set exposure.host=aks.example.test \
            --set exposure.scheme=http \
            --set frontend.service.public.loadBalancerIP=203.0.113.10 \
            --set frontend.autoscaling.enabled=true \
            --set frontend.autoscaling.minReplicas=1 \
            --set frontend.autoscaling.maxReplicas=3 \
            --set backend.autoscaling.enabled=true \
            --set backend.autoscaling.minReplicas=1 \
            --set backend.autoscaling.maxReplicas=4 \
            --set database.enabled=true \
            --set database.existingSecretName=sre-sql-creds

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Keep this false. What it prevents: checkout's default is to write
          # the workflow GITHUB_TOKEN into .git/config, and the steps below run
          # PR-controlled Terraform on the runner -- `terraform init` resolves
          # module sources this configuration names, and `terraform test`
          # evaluates its expressions. Neither needs git credentials, and this
          # job's whole contract is that it validates both roots with no cloud
          # credentials and is therefore safe on fork PRs. A token sitting in
          # the workspace is exactly the thing that contract is claiming is
          # absent.
          persist-credentials: false

      - name: Setup Terraform
        # v4.0.1
        uses: >-
          hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          # infra/oci/versions.tf floors at 1.10 (backend.tf's use_lockfile);
          # infra/ floors lower. Pin one version so a CI failure is never an
          # unannounced Terraform upgrade.
          terraform_version: "1.16.3"
          # The wrapper wraps stdout in a GitHub-Actions output block, which
          # corrupts the `terraform console` render below.
          terraform_wrapper: false

      - name: Terraform fmt
        # -recursive from infra/ covers the nested infra/oci/ root too.
        run: terraform -chdir=infra fmt -check -recursive

      # Both roots are validated and unit-tested with no cloud credentials:
      # -backend=false skips remote state entirely and every tftest.hcl uses
      # mock_provider. Applying either root stays a manual, operator-run
      # step (see infra/oci/README.md for why).
      - name: Terraform validate and test (Azure root)
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Terraform validate and test (OCI free-tier root)
        working-directory: infra/oci
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Lint the bootstrap script cloud-init actually writes
        working-directory: infra/oci
        run: |
          set -euo pipefail

          # `terraform console` refuses to run against an uninitialised
          # backend, and the real one is OCI Object Storage behind credentials
          # CI deliberately does not hold. An override file swaps in the local
          # backend for this step alone.
          #
          # Going through console rather than re-rendering the template here
          # is the whole point: the script linted below is the output of
          # compute.tf's own local.cloud_init, so it cannot drift from what
          # the instance boots. A CI-private templatefile() call could.
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init -reconfigure -input=false

          # terraform.tfvars.example doubles as the fixture, so this step also
          # proves the documented example still satisfies every variable
          # validation.
          #
          # yamldecode() is load-bearing: the step fails if the rendered
          # user_data is not parseable YAML. jsonencode() collapses the result
          # to one line; console then applies its own HCL string quoting on
          # top, hence two jq passes to unescape.
          #
          # The expression has to be a single line: `terraform console`
          # evaluates stdin one line at a time and errors on a wrapped one.
          script_path="/opt/bootstrap-k3s.sh"
          expression="jsonencode(one(["
          expression+="for f in yamldecode(local.cloud_init).write_files : "
          expression+="f.content if f.path == \"${script_path}\""
          expression+="]))"
          printf '%s\n' "${expression}" \
            | terraform console -var-file=terraform.tfvars.example \
            | jq -r . \
            | jq -r . \
            > "${RUNNER_TEMP}/bootstrap-k3s.sh"

          rm -f backend_override.tf

          if [[ ! -s "${RUNNER_TEMP}/bootstrap-k3s.sh" ]]; then
            echo "Rendered bootstrap script is empty; the write_files entry" \
              "for /opt/bootstrap-k3s.sh was not found." >&2
            exit 1
          fi

          bash -n "${RUNNER_TEMP}/bootstrap-k3s.sh"
          shellcheck "${RUNNER_TEMP}/bootstrap-k3s.sh"

  # ---------------------------------------------------------------------
  # The OCI box's deployment shape, on real k3s.
  #
  # free-e2e covers the chart on k3d, but k3d keeps ServiceLB and the stock
  # Traefik Service. The box runs the opposite: --disable=servicelb,
  # service.enabled: false, hostNetwork: true. That combination is what
  # preserves the client IP, and nothing else in CI exercises it.
  #
  # A GitHub-hosted Linux runner is already a VM, so k3s is installed
  # directly on it rather than nested inside another one. ubuntu-24.04-arm
  # is free for public repositories and matches the A1.Flex architecture.
  #
  # Three bugs found on a local aarch64 dry-run VM are the reason this job
  # exists. Two of them are only visible here:
  #
  #   * redirectTo (removed in Traefik chart v34) is a hard install failure
  #     that leaves Traefik at chart defaults with servicelb already
  #     disabled -- no ingress at all. Fresh boot catches it.
  #   * Without updateStrategy: Recreate the surge pod can never schedule on
  #     a single hostNetwork node, so the old pod keeps serving the old
  #     config while helm reports success. A fresh boot cannot see this at
  #     all; it needs a second apply, which is what the mutate step below
  #     does.
  # ---------------------------------------------------------------------
  oci-shape-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MANIFEST_DIR: /var/lib/rancher/k3s/server/manifests
      MANIFEST: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
      SHARED_CONFIG: infra/oci/traefik-config.yaml
      # CI can never complete an ACME order (no public DNS for a runner), so
      # the address is a dummy and Traefik serves its self-signed default
      # certificate. Everything below therefore uses curl -k.
      CI_ACME_EMAIL: ci@example.invalid
      PROBE_HOST: shape-probe.example.test
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This job extracts a shell fragment out of the PR's own
          # cloud-init.yaml.tftpl and runs it under `sudo bash -c`. Left at
          # the default, checkout writes the workflow GITHUB_TOKEN into
          # .git/config, so that PR-controlled fragment could read and
          # exfiltrate it; harden-runner's `egress-policy: audit` records
          # egress, it does not block it. The job needs no git credentials.
          persist-credentials: false

      - name: Setup Terraform
        # v4.0.1
        uses: >-
          hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Install the Traefik config the box will run
        run: |
          set -euo pipefail

          # Copied, not forked. The only permitted difference from the file in
          # the repository is the ACME address, and the round-trip diff below
          # proves that is the only one -- so a CI-only tweak to make this job
          # pass cannot survive review.
          sudo mkdir -p "${MANIFEST_DIR}"
          sed "s/ACME_EMAIL_PLACEHOLDER/${CI_ACME_EMAIL}/" "${SHARED_CONFIG}" \
            | sudo tee "${MANIFEST}" >/dev/null

          diff -u "${SHARED_CONFIG}" \
            <(sudo sed "s/${CI_ACME_EMAIL}/ACME_EMAIL_PLACEHOLDER/" \
                "${MANIFEST}")
          echo "Manifest matches ${SHARED_CONFIG} byte for byte."

      - name: Install k3s with cloud-init's own flags
        run: |
          set -euo pipefail

          # The install command is lifted out of the rendered cloud-init
          # rather than retyped, so the flags cannot drift from what the
          # instance boots. Rendering goes through the Terraform root's own
          # local.cloud_init for the same reason.
          pushd infra/oci >/dev/null
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init -reconfigure -input=false >/dev/null
          expression="jsonencode(one(["
          expression+="for f in yamldecode(local.cloud_init).write_files : "
          expression+='f.content if f.path == "/opt/bootstrap-k3s.sh"'
          expression+="]))"
          printf '%s\n' "${expression}" \
            | terraform console -var-file=terraform.tfvars.example \
            | jq -r . \
            | jq -r . \
            > "${RUNNER_TEMP}/bootstrap-k3s.sh"
          rm -f backend_override.tf
          popd >/dev/null

          # Extracted on the script's own structure -- the whole
          # `if ! command -v k3s ... fi` block, plus the log() helper it
          # calls -- rather than on a substring of one command. The previous
          # anchor was the literal `curl -sfL https://get.k3s.io`, and when
          # the template moved to a tagged, checksum-verified installer that
          # string stopped existing: the extraction went empty and this step
          # failed with a message about servicelb, which named neither the
          # anchor nor the line that had moved. A block that begins and ends
          # on lines the shell itself delimits survives an edit inside it.
          install_cmd="$(
            sed -n '/^log() {/p' "${RUNNER_TEMP}/bootstrap-k3s.sh"
            sed -n '/^if ! command -v k3s /,/^fi$/p' \
              "${RUNNER_TEMP}/bootstrap-k3s.sh"
          )"

          # Every assertion below names a line that must be *executed here*,
          # not merely present in the template. The old check tested one flag,
          # so an extraction that had lost the digest verification -- the
          # control that stops a rewritten tag executing as root at boot --
          # would have passed it and this job would have reported the shape
          # proven while never running the pin.
          missing=()
          for needle in \
            'curl -sfL -o /opt/k3s-install.sh' \
            'sha256sum -c -' \
            'refusing to execute it' \
            'sh /opt/k3s-install.sh server' \
            '--disable=metrics-server' \
            '--disable=servicelb' \
            '--write-kubeconfig-mode 600' \
            '--tls-san'
          do
            grep -qF -- "${needle}" <<<"${install_cmd}" \
              || missing+=("${needle}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The k3s install block extracted from the rendered" \
              "bootstrap script is missing: ${missing[*]}." \
              "cloud-init.yaml.tftpl has been restructured; re-anchor the" \
              "sed above on the block that now installs k3s."
            exit 1
          fi

          # A fragment that does not parse would otherwise fail part-way
          # through `sudo bash -c`, after the download and before the flags,
          # which reads as a k3s problem rather than an extraction one.
          if ! bash -n <<<"${install_cmd}"; then
            echo "::error::The extracted k3s install block is not valid" \
              "shell;" \
              "the sed range no longer lines up with the script's structure."
            exit 1
          fi
          echo "Running the install command cloud-init runs:"
          echo "${install_cmd}"

          # The manifest is already in place, exactly as on a fresh boot,
          # where cloud-init writes it before k3s ever starts. That ordering
          # is what makes a bad HelmChartConfig fatal instead of cosmetic.
          sudo bash -c "${install_cmd}"

          mkdir -p "${HOME}/.kube"
          sudo cp /etc/rancher/k3s/k3s.yaml "${HOME}/.kube/config"
          sudo chown "$(id -u):$(id -g)" "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Wait for the node and for Traefik
        run: |
          set -euo pipefail
          kubectl wait --for=condition=Ready node --all --timeout=300s
          job_selector='helmcharts.helm.cattle.io/chart=traefik'
          for _ in $(seq 1 60); do
            if kubectl -n kube-system get deploy/traefik >/dev/null 2>&1; then
              break
            fi
            # An invalid HelmChartConfig makes the install job fail rather
            # than the Deployment appear late, and waiting out the rollout
            # timeout reports that as an unexplained NotFound five minutes
            # later. The chart's own `fail` message is the actual answer, so
            # surface it the moment it exists.
            if [ "$(kubectl -n kube-system get jobs -l "${job_selector}" \
              -o jsonpath='{.items[*].status.failed}')" != "" ]; then
              echo "::error::Traefik HelmChartConfig rejected by the chart."
              kubectl -n kube-system logs -l "${job_selector}" --tail=50
              exit 1
            fi
            sleep 5
          done
          # Bug 1's signature, for the case where the job never even starts.
          kubectl -n kube-system rollout status deploy/traefik --timeout=300s

      - name: Assert the deployment shape
        run: |
          set -euo pipefail
          failed=0

          echo "--- no svclb DaemonSet (--disable=servicelb) ---"
          if kubectl -n kube-system get daemonset -o name \
            | grep -q 'svclb'; then
            echo "::error::A svclb DaemonSet exists. It contends with" \
              "hostNetwork Traefik for ports 80 and 443 and masquerades the" \
              "source address."
            failed=1
          fi

          echo "--- no traefik Service (service.enabled: false) ---"
          if kubectl -n kube-system get svc traefik >/dev/null 2>&1; then
            echo "::error::A traefik Service exists. With hostNetwork it is" \
              "dead weight that reintroduces NAT."
            failed=1
          fi

          echo "--- Traefik runs in the host network namespace ---"
          host_network="$(
            kubectl -n kube-system get deploy/traefik \
              -o jsonpath='{.spec.template.spec.hostNetwork}'
          )"
          if [[ "${host_network}" != "true" ]]; then
            echo "::error::hostNetwork is '${host_network}', not true." \
              "Without it the TCP remote address is not the client address."
            failed=1
          fi

          pod_ip="$(
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=traefik \
              -o jsonpath='{.items[0].status.podIP}'
          )"
          host_ip="$(
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=traefik \
              -o jsonpath='{.items[0].status.hostIP}'
          )"
          echo "podIP=${pod_ip} hostIP=${host_ip}"
          if [[ "${pod_ip}" != "${host_ip}" ]]; then
            echo "::error::podIP != hostIP, so Traefik is not actually in" \
              "the host network namespace."
            failed=1
          fi

          echo "--- the pinned image is the one actually running ---"
          # Every other assertion in this job passes just as happily against
          # the chart's default image, so without this one a misplaced `image:`
          # key would silently leave k3s running
          # rancher/mirrored-library-traefik:3.3.6 -- 4 CRITICAL CVEs in the
          # TLS path this pod terminates -- and the gate would stay green.
          #
          # The expectation is read out of the shared file rather than
          # hardcoded here, because that file's own comment says the tag no
          # longer tracks the chart appVersion and has to be bumped by hand.
          # A hardcoded copy would turn every bump into a two-file edit and
          # would eventually be the stale one.
          # The value may sit beside its key or on the next line -- the tag
          # carries a digest and the pair is 90 characters, which
          # `yamllint --strict` refuses, so the shared file puts it on its
          # own line. A `sed 's/^ *tag: *//p'` reads empty there, and an
          # empty expectation is the one failure mode this whole block exists
          # to rule out. `$1 == key` skips the commented copies: awk sees `#`
          # as the first field on those lines.
          read_pin() {
            awk -v key="$1:" '
              $1 == key {
                if (NF > 1) { print $2; exit }
                getline
                gsub(/^[ \t]+|[ \t]+$/, "", $0)
                print
                exit
              }
            ' "${SHARED_CONFIG}"
          }
          pinned_repo="$(read_pin repository)"
          pinned_tag="$(read_pin tag)"
          pinned_digest="${pinned_tag##*@}"
          if [[ -z "${pinned_repo}" || -z "${pinned_tag}" ]]; then
            echo "::error::Could not read image.repository/image.tag out of" \
              "${SHARED_CONFIG}. The pin is what keeps an internet-facing" \
              "ingress off a 4-critical-CVE base image; a gate that cannot" \
              "find it must fail, not skip."
            failed=1
          fi
          if [[ "${pinned_digest}" == "${pinned_tag}" ]]; then
            echo "::error::${SHARED_CONFIG} pins '${pinned_tag}', which" \
              "carries no digest. A tag is mutable, so the scanned bytes and" \
              "the running bytes stop being the same claim -- and the check" \
              "below reads a digest, so it would compare against nothing."
            failed=1
          fi
          # Read the *running* container, not the Deployment template. The
          # template is desired state: anything that rewrites the image on the
          # way to the pod -- a mutating webhook, a paused rollout, a manual
          # edit -- leaves the template reading correct while the node runs
          # something else. Reproduced on k3d before writing this: with the
          # rollout paused and the pin applied to the template, the template
          # read v3.7.13 while the pod ran v3.3.6 and every other assertion in
          # this job still passed. That is bug 6 again, one level down.
          #
          # `imageID`, not `image`. Once the reference carries a digest the
          # two stop agreeing, and only one of them still states the claim
          # the pin exists to make. Measured on k3s/containerd with a pod
          # pinned to exactly this reference:
          #
          #   spec    docker.io/library/traefik:v3.7.13@sha256:1c32e7c3...
          #   image   sha256:be6691ff...          <- the local config digest
          #   imageID docker.io/library/traefik@sha256:1c32e7c3...
          #
          # So `image` is not even a reference here, and comparing it against
          # repo:tag would fail on a perfectly correct deployment; `imageID`
          # carries the manifest digest, which is the byte-level identity the
          # trivy scan in the shared file describes. The tag is deliberately
          # not part of this comparison -- it is a human-readable label on a
          # reference whose authority is the digest.
          running_image_id="$(
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=traefik \
              -o jsonpath='{.items[0].status.containerStatuses[0].imageID}'
          )"
          if [[ -z "${running_image_id}" ]]; then
            echo "::error::No Traefik container status to read. The pod is" \
              "not running, so nothing here proves which image it would use."
            failed=1
          fi
          echo "pinned=${pinned_repo}@${pinned_digest}" \
            "running=${running_image_id}"
          if [[ "${running_image_id}" != "${pinned_repo}@${pinned_digest}" ]]
          then
            echo "::error::Traefik is running '${running_image_id}' but" \
              "${SHARED_CONFIG} pins" \
              "'${pinned_repo}@${pinned_digest}'. The image override did" \
              "not take effect."
            failed=1
          fi

          exit "${failed}"

      - name: Deploy a header-echoing probe behind the Ingress
        run: |
          set -euo pipefail
          # traefik/whoami echoes the request headers it received, which is a
          # far more direct read on client-IP integrity than any application
          # response. It is published for linux/arm64.
          kubectl create namespace shape-probe
          kubectl -n shape-probe create deployment whoami \
            --image=traefik/whoami:v1.10.2
          kubectl -n shape-probe expose deployment whoami --port=80
          kubectl -n shape-probe create ingress whoami \
            --class=traefik \
            --rule="${PROBE_HOST}/*=whoami:80"
          kubectl -n shape-probe rollout status deploy/whoami --timeout=180s

          # A Ready backend is not a programmed route. Traefik's Kubernetes
          # provider reconciles Ingresses asynchronously, so the client pod can
          # run while the router still does not exist and the first request
          # 404s -- which would fail the client-IP assertion on timing rather
          # than on substance, the flakiest possible way to lose a real signal.
          #
          # The poll must go over https. Entrypoint-level `redirections` answer
          # *every* :80 request with a 301 before any router is matched:
          # verified against traefik v3.7.13 with zero routers configured,
          # where :80 returned 301 and :443 returned 404. So a 301 on :80 says
          # nothing about whether this Ingress was ever reconciled, and only
          # the https 200 does.
          for attempt in $(seq 1 60); do
            code="$(
              curl -sk -o /dev/null -w '%{http_code}' --max-time 5 \
                -H "Host: ${PROBE_HOST}" https://127.0.0.1/ || true
            )"
            if [[ "${code}" == "200" ]]; then
              echo "whoami route observed after ${attempt} attempt(s)"
              break
            fi
            if [[ "${attempt}" -eq 60 ]]; then
              echo "::error::Traefik never routed ${PROBE_HOST} (last status" \
                "'${code}'). The Ingress exists but no router matched it."
              exit 1
            fi
            sleep 2
          done

      - name: Assert the redirect and client-IP integrity
        run: |
          set -euo pipefail

          # The request must come from a genuine non-loopback source. Loopback
          # and SSH-tunnelled traffic prove nothing here: on the real box they
          # hit the "-i lo -j ACCEPT" rule, and any of them would report a
          # client IP that no external caller would ever produce. A pod
          # curling the node's primary address is the closest CI can get to a
          # real external client.
          # Column 6 of `get nodes -o wide` is INTERNAL-IP.
          node_ip="$(kubectl get nodes -o wide --no-headers | awk '{print $6}')"
          echo "node_ip=${node_ip}"

          kubectl -n shape-probe run client \
            --image=curlimages/curl:8.13.0 \
            --restart=Never \
            --command -- sh -c "
              echo \"PROBE_POD_IP=\$(hostname -i)\";
              echo \"REDIRECT_CODE=\$(curl -s -o /dev/null -w '%{http_code}' \
                -H 'Host: ${PROBE_HOST}' http://${node_ip}/)\";
              echo '--- whoami over https ---';
              curl -sk -H 'Host: ${PROBE_HOST}' https://${node_ip}/
            "
          kubectl -n shape-probe wait pod/client \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=180s
          out="$(kubectl -n shape-probe logs pod/client)"
          echo "${out}"

          probe_ip="$(
            sed -n 's/^PROBE_POD_IP=//p' <<<"${out}" | tr -d '[:space:]'
          )"
          redirect_code="$(
            sed -n 's/^REDIRECT_CODE=//p' <<<"${out}" | tr -d '[:space:]'
          )"
          # `|| true` is load-bearing under `set -euo pipefail`: with no
          # X-Real-Ip in the output grep exits 1, pipefail propagates it, and
          # the assignment takes the step down *before* the empty-header branch
          # below can run. The one failure this assertion exists to report --
          # the header missing entirely -- was the one it could not report.
          real_ip="$(
            grep -i '^X-Real-Ip:' <<<"${out}" | head -1 | cut -d: -f2- \
              | tr -d '[:space:]' || true
          )"

          failed=0

          # Bug 1: with the removed redirectTo syntax the chart install fails
          # outright, so there is no redirect to observe. Asserting the exact
          # code also pins the `permanent: true` the mutate step flips.
          if [[ "${redirect_code}" != "301" ]]; then
            echo "::error::Expected a 301 from the web entrypoint, got" \
              "'${redirect_code}'."
            failed=1
          fi

          # The load-bearing assertion of the whole OCI design.
          if [[ -z "${real_ip}" ]]; then
            echo "::error::whoami saw no X-Real-Ip header at all."
            failed=1
          elif [[ "${real_ip}" != "${probe_ip}" ]]; then
            echo "::error::X-Real-Ip is '${real_ip}' but the client was" \
              "'${probe_ip}'. The source address is being masqueraded," \
              "which breaks every per-client-IP control in the app."
            failed=1
          else
            echo "X-Real-Ip (${real_ip}) is the true client address."
          fi

          exit "${failed}"

      - name: Re-apply a changed config and prove the running pod picked it up
        run: |
          set -euo pipefail

          # This is the only step that can see bug 2, and no fresh-boot test
          # ever will. Traefik's Deployment defaults to RollingUpdate with
          # maxSurge 1 / maxUnavailable 0; with hostNetwork on a single node
          # the surge pod can never schedule ("didn't have free ports for the
          # requested pod ports"). The old pod keeps serving the OLD config,
          # `kubectl get deploy` shows the NEW args, and helm reports
          # "deployed successfully" -- so every Traefik change after the first
          # silently no-ops unless updateStrategy is Recreate.
          #
          # The assertion is deliberately behavioural rather than a read of
          # the pod spec: flipping `permanent` changes 301 to 302 on the wire,
          # which can only happen if the process actually serving traffic
          # reloaded.
          sudo sed -i 's/permanent: true/permanent: false/' "${MANIFEST}"
          grep -q 'permanent: false' <(sudo cat "${MANIFEST}")

          node_ip="$(kubectl get nodes -o wide --no-headers | awk '{print $6}')"

          observed=""
          for _ in $(seq 1 60); do
            kubectl -n shape-probe delete pod recheck --ignore-not-found \
              >/dev/null 2>&1
            kubectl -n shape-probe run recheck \
              --image=curlimages/curl:8.13.0 \
              --restart=Never --quiet --attach --rm \
              --command -- curl -s -o /dev/null -w '%{http_code}' \
                -H "Host: ${PROBE_HOST}" "http://${node_ip}/" \
              > "${RUNNER_TEMP}/code" 2>/dev/null || true
            observed="$(tr -dc '0-9' < "${RUNNER_TEMP}/code")"
            if [[ "${observed}" == "302" ]]; then
              break
            fi
            sleep 5
          done

          if [[ "${observed}" != "302" ]]; then
            echo "::error::After re-applying the HelmChartConfig the running" \
              "Traefik still answers '${observed}', not 302. The rollout is" \
              "deadlocked -- check that updateStrategy.type is Recreate."
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=traefik -o wide || true
            exit 1
          fi
          echo "The running Traefik picked up the second apply."

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          echo "--- nodes ---"
          kubectl get nodes -o wide || true
          echo "--- kube-system ---"
          kubectl -n kube-system get deploy,ds,svc,pod -o wide || true
          echo "--- helm jobs ---"
          kubectl -n kube-system get jobs -o wide || true
          echo "--- helm install job logs ---"
          kubectl -n kube-system logs \
            -l helmcharts.helm.cattle.io/chart=traefik --tail=200 || true
          echo "--- traefik pod detail ---"
          kubectl -n kube-system describe pods \
            -l app.kubernetes.io/name=traefik || true
          echo "--- traefik logs ---"
          kubectl -n kube-system logs deploy/traefik --tail=200 || true
          echo "--- probe namespace ---"
          kubectl -n shape-probe get all -o wide || true
          echo "--- installed manifest ---"
          sudo cat "${MANIFEST}" || true
          echo "--- k3s service ---"
          sudo journalctl -u k3s --no-pager --lines=200 || true

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load Bun version
        uses: ./.github/actions/load-bun-version

      - name: Build Docker image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          COMPONENT: ${{ matrix.component }}
        run: >-
          docker build
          --build-arg BUN_VERSION="${BUN_VERSION}"
          -f "${DOCKERFILE}"
          -t "sre-simulator-${COMPONENT}"
          .

  # Merge-blocking browser gate. Runs entirely on GitHub-hosted infrastructure
  # with no cloud credentials, no GitHub Environment and no secrets, so it
  # works on fork PRs and Dependabot PRs too.
  #
  # k3d (not kind) on purpose: it runs the same k3s distribution as the OCI
  # production box, including the bundled Traefik ingress, local-path storage
  # and kube-router NetworkPolicy enforcement. That makes this gate double as
  # the regression test for values-oci.yaml.
  free-e2e:
    needs:
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - integration-test-postgres
      - security
      - helm-validate
      - docker-build
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_e2e != 'false' &&
      needs.lint-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.helm-validate.result == 'success' &&
      needs.docker-build.result == 'success' &&
      (
        needs.changes.outputs.run_integration != 'true' ||
        (
          needs.integration-test.result == 'success' &&
          needs.integration-test-mssql.result == 'success' &&
          needs.integration-test-postgres.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_RELEASE: sre-simulator
      E2E_NAMESPACE: sre-free-e2e
      K3D_CLUSTER: sre-free-e2e
      K3D_VERSION: v5.9.0
      K3D_SHA256: >-
        06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
      K3S_IMAGE: docker.io/rancher/k3s:v1.37.0-k3s1
      # *.localhost, not *.localtest.me: both resolve to loopback, but only
      # *.localhost is a browser "secure context". Off a secure context
      # Chromium hides crypto.randomUUID and crypto.subtle, which the chat
      # (hooks/useChat.ts) and the anonymous fingerprint
      # (lib/auth/fingerprint.ts) call unguarded - the suite then fails with
      # no 5xx, no failed request and no console error.
      E2E_HOST: sre-simulator.localhost
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Keep this false. What it prevents: checkout's default is to
          # write the workflow GITHUB_TOKEN into .git/config. That is not a
          # build-context concern -- `.dockerignore` excludes `.git`, so it
          # never reaches the image build. The exposure is host-side: this
          # job runs the PR's own code directly on the runner, starting at
          # `make install` (which executes the PR's dependency lifecycle
          # scripts) and again at `make test-e2e-live`, and any of it could
          # read the file off the workspace. The job is advertised as
          # credential-free, nothing in it needs git credentials, and
          # harden-runner is on `egress-policy: audit`, which records egress
          # rather than blocking it.
          persist-credentials: false

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Load Bun version
        id: bun
        uses: ./.github/actions/load-bun-version

      - name: Install dependencies
        run: make install

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      # Both images are rebuilt here rather than reused from docker-build.
      # That job runs a plain `docker build` with no cache export, no artifact
      # upload and no registry push, so its images never leave its own runner,
      # and publishing them to GHCR from a PR-head workflow would need the
      # registry credentials this gate exists to do without. It stays in
      # `needs:` as the cheap fail-fast check; the dedicated free-e2e-* GHA
      # cache scopes below are what actually keep the rebuild short.
      - name: Set up Docker Buildx
        # v4.3.0
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container

      - name: Build frontend image
        # v7.3.0
        uses: >-
          docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: frontend/Dockerfile
          tags: sre-simulator-frontend:pr
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          load: true
          cache-from: type=gha,scope=free-e2e-frontend
          cache-to: >-
            type=gha,scope=free-e2e-frontend,mode=max,ignore-error=true

      - name: Build backend image
        # v7.3.0
        uses: >-
          docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: backend/Dockerfile
          tags: sre-simulator-backend:pr
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          load: true
          cache-from: type=gha,scope=free-e2e-backend
          cache-to: >-
            type=gha,scope=free-e2e-backend,mode=max,ignore-error=true

      - name: Install k3d
        run: |
          set -euo pipefail
          url="https://github.com/k3d-io/k3d/releases/download"
          curl -fsSL "${url}/${K3D_VERSION}/k3d-linux-amd64" -o /tmp/k3d
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum --check --strict
          chmod +x /tmp/k3d
          sudo mv /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Create k3d cluster
        run: |
          set -euo pipefail
          # --port 80:80@loadbalancer publishes Traefik on the runner's port
          # 80, and Chromium maps *.localhost to loopback internally, so the
          # browser reaches the ingress with no /etc/hosts edit and no
          # port-forward. The readiness poll below sends an explicit Host
          # header to 127.0.0.1 and so needs no name resolution at all.
          # metrics-server is disabled to match the single-node OCI install,
          # where there is no HPA to feed.
          k3d cluster create "${K3D_CLUSTER}" \
            --agents 0 \
            --image "${K3S_IMAGE}" \
            --port "80:80@loadbalancer" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --wait \
            --timeout 180s
          kubectl cluster-info
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Import images into k3d
        run: |
          set -euo pipefail
          k3d image import \
            sre-simulator-frontend:pr \
            sre-simulator-backend:pr \
            --cluster "${K3D_CLUSTER}"

      - name: Wait for bundled Traefik
        run: |
          set -euo pipefail
          # Traefik arrives via a HelmChart CR, so the Deployment does not
          # exist immediately after the cluster reports ready.
          for _ in $(seq 1 60); do
            if kubectl -n kube-system get deploy/traefik \
              >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl -n kube-system rollout status deploy/traefik --timeout=180s

      - name: Deploy chart (OCI profile, mock AI, JSON storage)
        run: |
          set -euo pipefail
          session_secret="$(openssl rand -hex 32)"
          anti_abuse_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${session_secret}"
          echo "::add-mask::${anti_abuse_secret}"
          echo "LIVE_E2E_AUTH_SESSION_SECRET=${session_secret}" \
            >> "$GITHUB_ENV"

          kubectl create namespace "${E2E_NAMESPACE}"
          kubectl -n "${E2E_NAMESPACE}" create secret generic \
            free-e2e-runtime \
            --from-literal=auth-session-secret="${session_secret}" \
            --from-literal=anti-abuse-hmac-secret="${anti_abuse_secret}" \
            --from-literal=turnstile-secret-key=free-e2e-test-secret \
            --dry-run=client -o yaml |
            kubectl apply -f -

          # Three values files, then the mock-AI / JSON-storage overrides that
          # the Dependabot E2E path already proves the browser suite passes
          # against. AI and storage stay at chart defaults in values-oci.yaml
          # itself, so they have to be set here.
          helm upgrade --install "${E2E_RELEASE}" ./helm/sre-simulator \
            --namespace "${E2E_NAMESPACE}" \
            --values ./helm/sre-simulator/values.yaml \
            --values ./helm/sre-simulator/values-oci.yaml \
            --values ./helm/sre-simulator/values-ci-k3d.yaml \
            --set-string "fullnameOverride=${E2E_RELEASE}" \
            --set-string "frontend.image.repository=sre-simulator-frontend" \
            --set-string "frontend.image.tag=pr" \
            --set frontend.image.pullPolicy=Never \
            --set-string "backend.image.repository=sre-simulator-backend" \
            --set-string "backend.image.tag=pr" \
            --set backend.image.pullPolicy=Never \
            --set ai.mockMode=true \
            --set ai.strictStartup=false \
            --set database.enabled=false \
            --set backend.allowDeployedJsonStorageForTests=true \
            --set frontend.auth.githubOAuthEnabled=false \
            --set frontend.auth.existingSecretName=free-e2e-runtime \
            --set frontend.auth.antiAbuseHmacSecretKey=anti-abuse-hmac-secret \
            --set backend.auth.existingSecretName=free-e2e-runtime \
            --set backend.auth.antiAbuseHmacSecretKey=anti-abuse-hmac-secret \
            --set backend.auth.turnstileSecretKey=turnstile-secret-key \
            --set backend.auth.turnstileTestMode=true \
            --set backend.auth.localTestVerificationEnabled=true \
            --wait --timeout 10m

      - name: Assert the OCI profile's storage actually bound
        run: |
          set -euo pipefail
          # values-oci.yaml sets storage.storageClass: local-path, and this
          # gate exists to be the regression test for that file. The gate used
          # to pass --set storage.enabled=false, lifted from dependabot-e2e
          # where the target is AKS; on k3d the whole point is that the k3s
          # local-path provisioner is there. With the PVC suppressed the
          # backend ran on an emptyDir and the profile's storage setting was
          # never read, so the gate reported coverage it did not have.
          #
          # helm --wait does not wait on a PVC, and local-path binds
          # WaitForFirstConsumer, so this reads the bound state rather than
          # assuming the deploy implies it.
          phase="$(kubectl -n "${E2E_NAMESPACE}" get pvc \
            "${E2E_RELEASE}-data" -o jsonpath='{.status.phase}' || true)"
          class="$(kubectl -n "${E2E_NAMESPACE}" get pvc \
            "${E2E_RELEASE}-data" -o jsonpath='{.spec.storageClassName}' \
            || true)"
          echo "PVC ${E2E_RELEASE}-data: phase=${phase} class=${class}"
          if [[ "${phase}" != "Bound" ]]; then
            echo "::error::OCI profile PVC is ${phase:-absent}, not Bound."
            exit 1
          fi
          if [[ "${class}" != "local-path" ]]; then
            echo "::error::PVC class is '${class}', expected local-path."
            exit 1
          fi

      - name: Wait for ingress to answer
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -H "Host: ${E2E_HOST}" http://127.0.0.1/ \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "::error::Ingress did not answer on http://${E2E_HOST}/"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: make playwright-install

      - name: Run browser E2E
        env:
          # Derived from E2E_HOST so the gate host has exactly one definition
          # in this workflow. It has to stay a *.localhost name; see the
          # E2E_HOST comment above.
          LIVE_E2E_BASE_URL: http://${{ env.E2E_HOST }}
        run: make test-e2e-live

      - name: Helm test
        run: |
          set -euo pipefail
          helm test "${E2E_RELEASE}" \
            --namespace "${E2E_NAMESPACE}" \
            --logs \
            --timeout 4m

      - name: Start Postgres in the cluster
        run: |
          set -euo pipefail
          # values-oci.yaml's real database is Neon, which is external and
          # needs a credential no PR run may hold, so an in-cluster
          # postgres:17-alpine stands in for it. What this phase gates is the
          # chart-side wiring - database.driver reaching STORAGE_BACKEND, the
          # DATABASE_URL secret, and initStorage() running its migrations
          # from inside the pod. integration-test-postgres covers none of
          # that: it drives the stores directly and never boots the chart.
          pg_password="$(openssl rand -hex 16)"
          echo "::add-mask::${pg_password}"
          # Built in two steps on purpose. A single line would not fit, and
          # folding it in YAML would join the halves with a space, silently
          # corrupting the URL.
          pg_url="postgres://sresimulator:${pg_password}"
          pg_url="${pg_url}@free-e2e-postgres:5432/sresimulator"
          kubectl -n "${E2E_NAMESPACE}" create secret generic \
            free-e2e-postgres \
            --from-literal=postgres-password="${pg_password}" \
            --from-literal=connection-string="${pg_url}" \
            --dry-run=client -o yaml |
            kubectl apply -f -
          kubectl -n "${E2E_NAMESPACE}" apply -f - <<'MANIFEST'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: free-e2e-postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: free-e2e-postgres
            template:
              metadata:
                labels:
                  app: free-e2e-postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:17-alpine
                    env:
                      - name: POSTGRES_USER
                        value: sresimulator
                      - name: POSTGRES_DB
                        value: sresimulator
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: free-e2e-postgres
                            key: postgres-password
                    ports:
                      - containerPort: 5432
                    readinessProbe:
                      exec:
                        command:
                          - pg_isready
                          - -U
                          - sresimulator
                          - -d
                          - sresimulator
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                volumes:
                  - name: data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: free-e2e-postgres
          spec:
            selector:
              app: free-e2e-postgres
            ports:
              - port: 5432
                targetPort: 5432
          MANIFEST
          kubectl -n "${E2E_NAMESPACE}" rollout status \
            deploy/free-e2e-postgres --timeout=180s

      - name: Redeploy on the Postgres backend
        run: |
          set -euo pipefail
          # --reuse-values keeps the entire flag set the first deploy already
          # proved, so the storage backend is the only difference between the
          # two releases. allowDeployedJsonStorageForTests goes back to false
          # deliberately: with a real database attached, a silent fall back
          # to the JSON stores would make every assertion below vacuous.
          #
          # This phase has to stay after the PVC assertion, not before it:
          # templates/pvc.yaml renders only when database.enabled is false,
          # so the redeploy deletes the claim. Measured on k3d - the release
          # goes from 8 rendered resources to 7 and the backend loses its
          # /data mount, which is the chart working as intended and not
          # something to wait on here.
          helm upgrade "${E2E_RELEASE}" ./helm/sre-simulator \
            --namespace "${E2E_NAMESPACE}" \
            --reuse-values \
            --set database.enabled=true \
            --set-string database.driver=postgres \
            --set-string database.existingSecretName=free-e2e-postgres \
            --set backend.allowDeployedJsonStorageForTests=false \
            --wait --timeout 5m

      - name: Assert the backend really is on Postgres
        run: |
          set -euo pipefail
          # Read what changed state, not what describes it. A Deployment spec
          # carrying STORAGE_BACKEND=postgres proves only that helm rendered
          # it; these read the running pod's own log and then the database it
          # wrote to.
          # Pick the pod explicitly. `kubectl logs deployment/...` chooses an
          # arbitrary pod when more than one matches, and the JSON-storage
          # pod is still terminating right after the upgrade, so the
          # deployment form can replay the previous release's log and report
          # success whatever the new pod did. Proven by control: with the
          # backend reverted to JSON storage the deployment form still
          # passed every assertion below.
          backend_pod="$(kubectl -n "${E2E_NAMESPACE}" get pod \
            -l app.kubernetes.io/component=backend \
            --field-selector=status.phase=Running \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1:].metadata.name}')"
          echo "backend pod: ${backend_pod}"
          log="$(kubectl -n "${E2E_NAMESPACE}" logs "${backend_pod}" \
            --tail=400)"
          for line in \
            "[storage] Postgres connection verified" \
            "[storage] migrations complete" \
            "[storage] backend=postgres ready"; do
            if ! grep -qF "${line}" <<<"${log}"; then
              echo "::error::backend log is missing: ${line}"
              tail -50 <<<"${log}"
              exit 1
            fi
          done

          pg_pod="$(kubectl -n "${E2E_NAMESPACE}" get pod \
            -l app=free-e2e-postgres \
            -o jsonpath='{.items[0].metadata.name}')"
          run_sql() {
            kubectl -n "${E2E_NAMESPACE}" exec "${pg_pod}" -- \
              psql -U sresimulator -d sresimulator -tAc "$1"
          }

          # _migrations is written by the backend's own pool, so a row here
          # is the one thing in this phase that proves a write reached the
          # database rather than only that the app said it had.
          applied="$(run_sql "SELECT name FROM _migrations ORDER BY name")"
          echo "applied migrations: ${applied}"
          if ! grep -qF "001_init.sql" <<<"${applied}"; then
            echo "::error::the backend recorded no migration"
            exit 1
          fi

          for table in sessions leaderboard_entries gameplay_metrics \
            players anonymous_trial_claims; do
            sql="SELECT to_regclass('public.${table}') IS NOT NULL"
            if [[ "$(run_sql "${sql}")" != "t" ]]; then
              echo "::error::table ${table} is absent after migration"
              exit 1
            fi
          done

      - name: Helm test (Postgres backend)
        run: |
          set -euo pipefail
          helm test "${E2E_RELEASE}" \
            --namespace "${E2E_NAMESPACE}" \
            --logs \
            --timeout 4m

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          echo "--- ingress ---"
          kubectl -n "${E2E_NAMESPACE}" get ingress -o wide || true
          echo "--- workloads ---"
          kubectl -n "${E2E_NAMESPACE}" get \
            deploy,pod,svc,endpoints -o wide || true
          echo "--- pod detail ---"
          kubectl -n "${E2E_NAMESPACE}" describe pods || true
          echo "--- frontend logs ---"
          kubectl -n "${E2E_NAMESPACE}" logs \
            "deployment/${E2E_RELEASE}-frontend" --tail=200 || true
          echo "--- backend logs ---"
          kubectl -n "${E2E_NAMESPACE}" logs \
            "deployment/${E2E_RELEASE}-backend" --tail=200 || true
          echo "--- traefik logs ---"
          kubectl -n kube-system logs deploy/traefik --tail=200 || true
          echo "--- postgres logs ---"
          kubectl -n "${E2E_NAMESPACE}" logs \
            deploy/free-e2e-postgres --tail=100 || true
          # `helm test --logs` prints only the test container, which never
          # starts when the wait-for-network-policy init container times out.
          echo "--- helm test pod logs (all containers) ---"
          kubectl -n "${E2E_NAMESPACE}" logs "${E2E_RELEASE}-test" \
            --all-containers=true --tail=200 || true

      - name: Upload E2E artifacts
        if: always()
        # v4.6.2
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: free-e2e-artifacts
          path: data/playwright-live-e2e*
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete "${K3D_CLUSTER}" || true

  live-e2e:
    needs:
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - integration-test-postgres
      - security
      - helm-validate
      - docker-build
    if: >-
      always() &&
      vars.LIVE_E2E_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_e2e != 'false' &&
      needs.lint-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.helm-validate.result == 'success' &&
      needs.docker-build.result == 'success' &&
      (
        needs.changes.outputs.run_integration != 'true' ||
        (
          needs.integration-test.result == 'success' &&
          needs.integration-test-mssql.result == 'success' &&
          needs.integration-test-postgres.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: live-e2e
    concurrency:
      group: sresimulator-live-e2e-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      CLUSTER_FLAVOR: aks
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_RG: ${{ secrets.AKS_RG }}
      AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}
      AOAI_RG: ${{ secrets.AOAI_RG }}
      AOAI_ACCOUNT: ${{ secrets.AOAI_ACCOUNT }}
      AOAI_DEPLOYMENT: ${{ secrets.AOAI_DEPLOYMENT }}
      AOAI_DEPLOYMENT_CHAT: ${{ secrets.AOAI_DEPLOYMENT_CHAT }}
      AOAI_DEPLOYMENT_COMMAND: ${{ secrets.AOAI_DEPLOYMENT_COMMAND }}
      AOAI_DEPLOYMENT_SCENARIO: ${{ secrets.AOAI_DEPLOYMENT_SCENARIO }}
      AOAI_DEPLOYMENT_PROBE: ${{ secrets.AOAI_DEPLOYMENT_PROBE }}
      GITHUB_AUTH_SECRET_NAME: >-
        ${{
          vars.AUTH_SECRET_NAME ||
          secrets.AUTH_SECRET_NAME ||
          vars.GITHUB_AUTH_SECRET_NAME ||
          secrets.GITHUB_AUTH_SECRET_NAME ||
          'sre-auth-secrets'
        }}
      AUTH_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      DB_SECRET_NAME: ${{ secrets.DB_SECRET_NAME }}
      DB_SECRET_SOURCE_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      PROD_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      E2E_NAMESPACE_PREFIX: sre-pr-${{ github.event.number }}
      E2E_METADATA_FILE: data/live-e2e-${{ github.event.number }}.env
      E2E_RELEASE: sre-simulator
      AKS_E2E_EXPOSURE_MODE: none
      AKS_E2E_PUSH_DEV_IMAGES: "true"
      # Reuse the previous push's image layers instead of reinstalling
      # node_modules and rebuilding the frontend bundle every time. The deploy
      # step spent 116 of its 196 seconds rebuilding images that had not
      # changed.
      AKS_E2E_IMAGE_CACHE: "true"
      AKS_E2E_DEV_IMAGE_TAG_SUFFIX: dev
      GHCR_USERNAME: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
      TURNSTILE_TEST_MODE: "true"
      LOCAL_TEST_VERIFICATION_ENABLED: "true"
      LIVE_E2E_ARTIFACT_DIR: >-
        data/playwright-live-e2e-${{ github.event.number }}
      LIVE_E2E_VIEWER_PREFIX: >-
        pr-${{ github.event.number }}-${{ github.run_id }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Azure login
        # v3.0.0
        uses: >-
          azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate privileged E2E configuration
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_SUBSCRIPTION_ID AKS_RG AKS_CLUSTER \
            AOAI_RG AOAI_ACCOUNT AOAI_DEPLOYMENT \
            GITHUB_AUTH_SECRET_NAME DB_SECRET_NAME PROD_NAMESPACE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing live E2E configuration: ${missing[*]}"
            exit 1
          fi

      - name: Deploy PR head to isolated E2E namespace
        run: make e2e-azure-route-up

      - name: Install Playwright Chromium
        run: make playwright-install

      - name: Run live Playwright platform flows
        run: |
          set -euo pipefail
          ns="$(sed -n 's/^NS=//p' "$E2E_METADATA_FILE")"
          base_url="$(sed -n 's/^URL=//p' "$E2E_METADATA_FILE")"
          session_secret="$(
            kubectl -n "$ns" get "secret/$GITHUB_AUTH_SECRET_NAME" \
              -o jsonpath='{.data.auth-session-secret}' |
              base64 --decode
          )"
          if [[ -z "$ns" || -z "$base_url" || -z "$session_secret" ]]; then
            echo "E2E metadata or auth session secret is missing."
            exit 1
          fi
          export LIVE_E2E_BASE_URL="$base_url"
          export LIVE_E2E_AUTH_SESSION_SECRET="$session_secret"
          make test-e2e-live
          unset LIVE_E2E_AUTH_SESSION_SECRET session_secret

      - name: Add live E2E result summary
        if: always()
        run: |
          if [[ -f "$LIVE_E2E_ARTIFACT_DIR/results.json" ]]; then
            echo "### Live Playwright E2E" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$LIVE_E2E_ARTIFACT_DIR/results.json" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live E2E artifacts
        if: always()
        # v4.6.2
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-e2e-pr-${{ github.event.number }}
          path: ${{ env.LIVE_E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary E2E namespace
        if: always()
        run: |
          if [[ -f "$E2E_METADATA_FILE" ]]; then
            make e2e-azure-route-down
          fi

  ci-gate:
    if: always()
    permissions:
      contents: read
      statuses: read
    needs:
      - tag-mainline-check
      - changes
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - integration-test-postgres
      - security
      - helm-validate
      - terraform-validate
      - oci-shape-e2e
      - docker-build
      - free-e2e
      - live-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TAG_MAINLINE_RESULT: ${{ needs.tag-mainline-check.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
          LINT_RESULT: ${{ needs.lint-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          INTEGRATION_MSSQL_RESULT: ${{ needs.integration-test-mssql.result }}
          INTEGRATION_POSTGRES_RESULT: >-
            ${{ needs.integration-test-postgres.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          HELM_RESULT: ${{ needs.helm-validate.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-validate.result }}
          OCI_SHAPE_RESULT: ${{ needs.oci-shape-e2e.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          FREE_E2E_RESULT: ${{ needs.free-e2e.result }}
          LIVE_E2E_RESULT: ${{ needs.live-e2e.result }}
          # Unset by default, which is what keeps the Azure-backed live-e2e
          # job skipped and out of the merge decision.
          LIVE_E2E_ENABLED: ${{ vars.LIVE_E2E_ENABLED }}
          # Likewise unset by default. dependabot-e2e deploys to the same dead
          # AKS cluster, so its status can never reach success and polling for
          # it would freeze every bot PR for 70 minutes. The same variable
          # gates dependabot-e2e.yml's own entry job, so unset means the run
          # never starts rather than starting and being ignored here -- the
          # two have to agree, or ci-gate would wait for a status nothing is
          # going to publish. The whole path is deleted in a follow-up; the
          # variable keeps it recoverable until then.
          DEPENDABOT_E2E_ENABLED: ${{ vars.DEPENDABOT_E2E_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          # live-e2e also skips for fork PRs, because it releases cluster and
          # AI credentials to PR code. ci-gate has to know that, or enabling
          # the optional Azure path would fail every fork PR on a job that was
          # never eligible to run.
          IS_SAME_REPO_PR: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name ==
                github.repository }}
          IS_DEPENDABOT: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.user.login == 'dependabot[bot]' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=false
          failed_jobs=()

          echo "CI job results:"
          echo "  tag-mainline-check:         ${TAG_MAINLINE_RESULT}"
          echo "  changes:                    ${CHANGES_RESULT}"
          echo "  docs-only change:           ${DOCS_ONLY}"
          echo "  run integration suites:     ${RUN_INTEGRATION}"
          echo "  lint-typecheck:             ${LINT_RESULT}"
          echo "  test:                       ${TEST_RESULT}"
          echo "  integration-test:           ${INTEGRATION_RESULT}"
          echo "  integration-test-mssql:     ${INTEGRATION_MSSQL_RESULT}"
          echo "  integration-test-postgres:  ${INTEGRATION_POSTGRES_RESULT}"
          echo "  security:                   ${SECURITY_RESULT}"
          echo "  helm-validate:              ${HELM_RESULT}"
          echo "  terraform-validate:         ${TERRAFORM_RESULT}"
          echo "  oci-shape-e2e:              ${OCI_SHAPE_RESULT}"
          echo "  docker-build:               ${DOCKER_RESULT}"
          echo "  run browser e2e:            ${RUN_E2E}"
          echo "  free-e2e:                   ${FREE_E2E_RESULT}"
          echo "  live-e2e enabled:           ${LIVE_E2E_ENABLED:-false}"
          echo "  dependabot-e2e enabled:     ${DEPENDABOT_E2E_ENABLED:-false}"
          echo "  live-e2e:                   ${LIVE_E2E_RESULT}"

          for name_result in \
            "tag-mainline-check:${TAG_MAINLINE_RESULT}" \
            "changes:${CHANGES_RESULT}" \
            "lint-typecheck:${LINT_RESULT}" \
            "test:${TEST_RESULT}" \
            "security:${SECURITY_RESULT}" \
            "helm-validate:${HELM_RESULT}" \
            "terraform-validate:${TERRAFORM_RESULT}" \
            "oci-shape-e2e:${OCI_SHAPE_RESULT}" \
            "docker-build:${DOCKER_RESULT}"; do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            if [[ "$result" != "success" ]]; then
              failed=true
              failed_jobs+=("${name} (${result})")
            fi
          done

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${IS_DEPENDABOT}" == "true" &&
                  "${DEPENDABOT_E2E_ENABLED}" == "true" ]]; then
              # Dependabot E2E runs claim a namespace from a fixed-size pool
              # and a single run takes ~20 minutes, so once every slot is busy
              # the wait has to cover a queue of PRs, not a single run.
              dependabot_e2e_state=""
              for _ in $(seq 1 210); do
                dependabot_e2e_state="$(
                  gh api \
                    "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/status" \
                    --jq '
                      [
                        .statuses[] |
                        select(.context == "dependabot-e2e")
                      ] |
                      sort_by(.created_at) |
                      last |
                      .state // ""
                    '
                )"
                case "${dependabot_e2e_state}" in
                  success)
                    break
                    ;;
                  failure|error)
                    break
                    ;;
                esac
                sleep 20
              done
              if [[ "${dependabot_e2e_state}" != "success" ]]; then
                failed=true
                failed_jobs+=(
                  "dependabot-e2e (${dependabot_e2e_state:-missing})"
                )
                case "${dependabot_e2e_state}" in
                  ""|pending)
                    echo ""
                    echo "The dependabot-e2e status never reached a terminal" \
                      "state within the wait window."
                    echo "This usually means every namespace in the" \
                      "Dependabot E2E pool was busy, so the run could not" \
                      "claim a slot. Check DEPENDABOT_E2E_NAMESPACE_POOL and" \
                      "whether the pool is large enough for the number of" \
                      "open Dependabot PRs."
                    echo "It is not evidence that this dependency update is" \
                      "broken. Re-run 'Dependabot E2E Build' for this PR once" \
                      "the pool has capacity."
                    ;;
                esac
              fi
            fi

            # free-e2e gates Dependabot PRs too, so this is a separate `if`
            # rather than another arm of the chain above. With
            # DEPENDABOT_E2E_ENABLED unset the free k3d gate is the only
            # browser gate a bot PR has to satisfy; set it to 'true' and the
            # pooled AKS status has to be green as well.
            if [[ "${RUN_E2E}" == "false" ]]; then
              echo "Browser E2E intentionally skipped (inert docs/repo-meta" \
                "change)."
            else
              if [[ "${FREE_E2E_RESULT}" != "success" ]]; then
                failed=true
                failed_jobs+=("free-e2e (${FREE_E2E_RESULT})")
              fi
              # live-e2e is opt-in: without vars.LIVE_E2E_ENABLED the job is
              # skipped, and a skipped job must not block the merge. The two
              # extra conditions mirror the job's own `if:` -- it also skips
              # for Dependabot and for fork PRs, so without them, turning the
              # variable on would fail every such PR with "live-e2e (skipped)"
              # for a job that was never eligible. free-e2e above is what
              # gates those PRs.
              if [[ "${LIVE_E2E_ENABLED}" == "true" &&
                    "${IS_DEPENDABOT}" != "true" &&
                    "${IS_SAME_REPO_PR}" == "true" &&
                    "${LIVE_E2E_RESULT}" != "success" ]]; then
                failed=true
                failed_jobs+=("live-e2e (${LIVE_E2E_RESULT})")
              fi
            fi
          else
            echo "Browser E2E is required for pull requests only."
          fi

          if [[ "${RUN_INTEGRATION}" == "true" ]]; then
            for name_result in \
              "integration-test:${INTEGRATION_RESULT}" \
              "integration-test-mssql:${INTEGRATION_MSSQL_RESULT}" \
              "integration-test-postgres:${INTEGRATION_POSTGRES_RESULT}"; do
              name="${name_result%%:*}"
              result="${name_result#*:}"
              if [[ "$result" != "success" ]]; then
                failed=true
                failed_jobs+=("${name} (${result})")
              fi
            done
          else
            echo "Integration suites intentionally skipped (docs-only change)."
          fi

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "Failed jobs:"
            for job in "${failed_jobs[@]}"; do
              echo "  - ${job}"
            done
            exit 1
          fi
          echo "All CI jobs passed."

  update-coverage-badge:
    runs-on: ubuntu-latest
    needs:
      - lint-typecheck
      - test
      - integration-test
      - integration-test-mssql
      - integration-test-postgres
      - security
      - helm-validate
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun toolchain
        uses: ./.github/actions/setup-bun-toolchain

      - name: Install dependencies
        run: make install

      - name: Run backend tests with coverage
        run: make test

      - name: Generate coverage badge
        run: |
          set -euo pipefail
          coverage_pct="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("backend/coverage/coverage-summary.json", "utf8")
            );
            process.stdout.write(String(data.total.lines.pct));
          ')"
          coverage_value="$(printf '%.1f' "$coverage_pct")"
          color="red"
          if awk "BEGIN {exit !($coverage_pct >= 90)}"; then
            color="brightgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 80)}"; then
            color="green"
          elif awk "BEGIN {exit !($coverage_pct >= 70)}"; then
            color="yellowgreen"
          elif awk "BEGIN {exit !($coverage_pct >= 60)}"; then
            color="yellow"
          elif awk "BEGIN {exit !($coverage_pct >= 50)}"; then
            color="orange"
          fi
          mkdir -p badges
          coverage_label="${coverage_value}%25"
          badge_url="https://img.shields.io/badge/coverage-"
          badge_url+="${coverage_label}-${color}.svg"
          curl -fsSL "$badge_url" -o badges/coverage.svg

      - name: Commit updated coverage badge
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge is already up to date."
            exit 0
          fi
          git add badges/coverage.svg
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(ci): update coverage badge [skip ci]"
          push_output="$(mktemp)"
          if git push origin HEAD:main >"${push_output}" 2>&1; then
            rm -f "${push_output}"
            exit 0
          fi
          if grep -Eiq \
            '(protected branch|GH006|repository rule violations|ruleset)' \
            "${push_output}"; then
            echo "::warning::Coverage badge push blocked by repository rules."
            echo "::warning::Skipping badge update push on protected main."
            cat "${push_output}"
            rm -f "${push_output}"
            exit 0
          fi
          echo "::error::Failed to push updated coverage badge."
          cat "${push_output}"
          rm -f "${push_output}"
          exit 1
