---
name: Cleanup E2E Namespaces

# Ephemeral E2E namespaces are removed by the always() step of the job that
# created them. A cancelled run or an expired runner token can still leave one
# behind, and a leaked namespace holds its CPU and memory requests until
# somebody notices. This job reclaims that capacity on a schedule.
#
# It then reports how much schedulable room is left, because reclaiming space
# only helps if somebody finds out when it stops being enough. A failed
# scheduled run is the alert, which keeps monitoring inside this repository
# instead of an external service.
#
# It runs only from the default branch, so it never executes pull request code
# with the Azure credentials, which is why it does not need the approval gate
# the live E2E job uses.

"on":
  schedule:
    # Monday 04:17 UTC, off the hour to avoid the scheduler backlog.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be removed
        type: boolean
        default: true
      min_age_hours:
        description: Minimum namespace age in hours
        type: string
        default: '24'

permissions:
  contents: read

concurrency:
  group: cleanup-e2e-namespaces
  cancel-in-progress: false

jobs:
  cleanup:
    name: cleanup-e2e-namespaces
    # workflow_dispatch can be started from any branch, so without this the job
    # would run that branch's script with cluster credentials. Refuse anything
    # but the default branch, which is what the safety model above assumes.
    if: >-
      github.ref == format('refs/heads/{0}',
        github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_RG: ${{ secrets.AKS_RG }}
      AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}
      PROD_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
      GH_TOKEN: ${{ github.token }}
      # A manual run defaults to reporting only. The weekly run is the one that
      # actually reclaims capacity, since nobody is there to confirm it.
      DRY_RUN: >-
        ${{ github.event_name == 'workflow_dispatch' &&
            inputs.dry_run && 'true' || 'false' }}
      CLEANUP_MIN_AGE_HOURS: >-
        ${{ github.event_name == 'workflow_dispatch' &&
            inputs.min_age_hours || '24' }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        # v5.0.0
        uses: >-
          azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Validate cleanup configuration
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_SUBSCRIPTION_ID AKS_RG AKS_CLUSTER PROD_NAMESPACE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing cleanup configuration: ${missing[*]}"
            exit 1
          fi

      - name: Azure login
        # v3.0.0
        uses: >-
          azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch cluster credentials
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$AKS_RG" \
            --name "$AKS_CLUSTER" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --overwrite-existing >/dev/null
          kubectl version --output=json >/dev/null

      - name: Reclaim stale E2E namespaces
        run: make cleanup-e2e-namespaces | tee cleanup.log

      # Reclaiming leaked namespaces only helps if somebody notices when it is
      # no longer enough. This reports how much *schedulable* room is left once
      # the cleanup has run, and fails the job when it drops too low, which is
      # the notification: a failed scheduled run is mailed to the repository
      # owner and needs no external monitoring service.
      - name: Report cluster capacity
        run: make cluster-capacity-report | tee capacity.log

      - name: Add cleanup summary
        if: always()
        run: |
          {
            echo "### E2E namespace cleanup"
            echo
            echo '```text'
            cat cleanup.log 2>/dev/null || echo "no output"
            echo '```'
            echo
            echo "### Cluster capacity"
            echo
            echo '```text'
            cat capacity.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
