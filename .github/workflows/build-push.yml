---
name: Build and Push Images

"on":
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  resolve-release-tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag for CI SHA
        id: resolve
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          mapfile -t semver_tags < <(
            git tag --points-at "$HEAD_SHA" | \
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {print}' | \
              sort -V
          )

          if [[ "${#semver_tags[@]}" -eq 0 ]]; then
            echo "No semver release tag found for this CI run."
            echo "Skipping image publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="${semver_tags[${#semver_tags[@]}-1]}"

          mapfile -t all_semver_tags < <(
            git tag | \
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {print}' | \
              sort -V
          )
          latest_semver_tag="${all_semver_tags[${#all_semver_tags[@]}-1]}"
          is_latest=false
          if [[ "$release_tag" == "$latest_semver_tag" ]]; then
            is_latest=true
          fi

          echo "Resolved release tag: ${release_tag} (latest=${is_latest})"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"

      # Resolved once here rather than in each downstream job. The per-arch
      # build and the manifest merge must address byte-identical image names --
      # a digest pushed under one spelling cannot be assembled under another --
      # and GHCR rejects an uppercase path component, so the lowercasing is
      # load-bearing rather than cosmetic.
      - name: Resolve the lowercase registry owner
        id: owner
        env:
          OWNER_RAW: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "${OWNER_RAW}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

  build-push:
    needs:
      - resolve-release-tag
    if: needs.resolve-release-tag.outputs.should_publish == 'true'
    # One runner per architecture, both native. The alternative -- one amd64
    # runner emulating arm64 through QEMU -- is 5-15x slower on a Bun plus
    # Next.js build and would blow the job timeout. This repository is public,
    # so the free `ubuntu-24.04-arm` runner is available.
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both architectures of a component are needed for the manifest list, so
      # a failure on one leg makes the other leg's image unpublishable anyway.
      # Letting it finish keeps the log of the *other* failure, which is what a
      # cross-architecture break usually needs.
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
            runner: ubuntu-latest
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
            runner: ubuntu-24.04-arm
          - component: backend
            context: .
            dockerfile: backend/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
            runner: ubuntu-latest
          - component: backend
            context: .
            dockerfile: backend/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ghcr.io
      RELEASE_TAG: ${{ needs.resolve-release-tag.outputs.release_tag }}
      IS_LATEST: ${{ needs.resolve-release-tag.outputs.is_latest }}
      IMAGE_REF: >-
        ghcr.io/${{ needs.resolve-release-tag.outputs.owner
        }}/sre-simulator-${{ matrix.component }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        # v6.0.2
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Load Bun version
        id: bun
        # Inlined on purpose: this privileged workflow_run job checks out the
        # untrusted PR head above, so a `uses: ./.github/actions/...` step would
        # execute action code from that untrusted checkout with packages:write.
        # The inline run block comes from the trusted default-branch workflow
        # file instead. See CodeQL "Checkout of untrusted code in a privileged
        # context".
        run: |
          set -euo pipefail
          if [ ! -s .bun-version ]; then
            echo "BUN_VERSION is required;" >&2
            echo ".bun-version is missing or empty." >&2
            exit 1
          fi
          version="$(tr -d '\n' < .bun-version)"
          echo "BUN_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        # v4.1.0
        uses: >-
          docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest needs a BuildKit builder; the default docker driver
      # cannot produce an untagged, digest-addressed push.
      - name: Set up Docker Buildx
        # v4.3.0
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      # No tag is applied here, and that is the point. Two runners pushing the
      # same tag would race, and the loser's architecture would vanish from the
      # registry -- the second push simply moves the tag. Each leg instead
      # pushes an untagged, digest-addressed image; the merge job below is the
      # only thing that ever writes a tag, and it writes a manifest list
      # naming both digests at once.
      #
      # Deliberately no cache-from/cache-to. scripts/aks-deploy.test.sh
      # asserts their absence in this workflow: live-e2e builds pull-request
      # code with packages: write, GHCR permissions are not scoped per tag, so
      # no cache ref a PR run can write is safe to import into a release
      # publish. Per-architecture cache scopes would have been the natural
      # thing to add here and are ruled out by that, not by oversight.
      - name: Build and push by digest
        id: build
        # v7.3.0
        uses: >-
          docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          # Double-quoted with a trailing backslash, not a folded `>-`
          # scalar: folding joins the lines with a SPACE, which would land in
          # the middle of this comma-separated list and produce a
          # ` name-canonical` key that BuildKit does not recognise. The
          # backslash continuation is the one YAML form that joins with
          # nothing at all.
          outputs: "type=image,name=${{ env.IMAGE_REF }},push-by-digest=true,\
            name-canonical=true,push=true"

      # The digest travels to the merge job as an empty file named after
      # itself, which is what upload-artifact can carry between jobs.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::The build produced no digest, so the manifest" \
              "list cannot be assembled. This usually means the image was" \
              "not actually pushed."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        # v4.6.2
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The only job that writes a tag. Each build-push leg pushed an untagged,
  # digest-addressed image; this assembles the two digests of one component
  # into a single manifest list and tags that. A puller on either architecture
  # then resolves the same tag to its own image, which is the whole point:
  # `docker pull ghcr.io/.../sre-simulator-backend:vX.Y.Z` has to work on the
  # aarch64 OCI box and on an amd64 AKS node without the caller knowing.
  merge:
    needs:
      - resolve-release-tag
      - build-push
    if: needs.resolve-release-tag.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - frontend
          - backend
    env:
      RELEASE_TAG: ${{ needs.resolve-release-tag.outputs.release_tag }}
      IS_LATEST: ${{ needs.resolve-release-tag.outputs.is_latest }}
      IMAGE_REF: >-
        ghcr.io/${{ needs.resolve-release-tag.outputs.owner
        }}/sre-simulator-${{ matrix.component }}
    steps:
      - name: Harden runner
        # v2.21.0
        uses: >-
          step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      # No checkout: this job only talks to the registry. Keeping the
      # untrusted PR head out of a packages:write job is the same reasoning
      # that made the Bun version step above an inline run block.

      - name: Login to GHCR
        # v4.1.0
        uses: >-
          docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # v4.3.0
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Download the digests
        # v4.3.0
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail

          # One file per architecture, named after its digest. Anything other
          # than two means a leg silently did not publish, and tagging a
          # half-populated manifest list is worse than failing: the tag would
          # exist and resolve on one architecture only, which is exactly the
          # bug this whole job removes.
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n')
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "::error::Expected 2 digests for ${{ matrix.component }}," \
              "found ${#digests[@]}: ${digests[*]-none}. The manifest list" \
              "must name both linux/amd64 and linux/arm64."
            exit 1
          fi

          tag_args=(-t "${IMAGE_REF}:${RELEASE_TAG}")
          if [[ "${IS_LATEST}" == "true" ]]; then
            tag_args+=(-t "${IMAGE_REF}:latest")
          fi

          # The check above counts digests; this one identifies them, and it
          # has to run before the tag exists. Verifying after `imagetools
          # create` -- which is where this started -- leaves a broken
          # ${RELEASE_TAG} published for as long as it takes someone to
          # notice, and deleting a released tag is not a thing this job should
          # be doing. Two digests of the same platform (a matrix edit that
          # duplicates a leg, which is the realistic way this breaks) satisfy
          # the count and would otherwise be caught only once live.
          #
          # A by-digest push has no platform in its descriptor, so the source
          # is the image config, read as `{{json .Image}}`.
          #
          # JSON, rather than `.Image.OS` and `.Image.Architecture` through a
          # scalar template, because that form is not safe on every shape this
          # step can be handed. buildx enables provenance attestations by
          # default on a registry push, so the pushed digest is normally an
          # OCI *index* carrying the image manifest plus an `unknown/unknown`
          # attestation manifest rather than a bare image manifest. imagetools
          # drops the attestation, so with one real platform `.Image` is still
          # a single image object and the scalar form does work -- verified
          # against a local registry both with and without
          # `--provenance=mode=min`.
          #
          # It stops working the moment a digest carries two real platforms:
          # `.Image` is then a map keyed by platform, and the scalar template
          # prints `<no value>/<no value>` *and exits 0*. The JSON form tells
          # those two shapes apart instead of yielding a string that means
          # nothing, and the count assertion below names the cause rather than
          # reporting both architectures as absent.
          source_args=()
          platforms=()
          for digest in "${digests[@]}"; do
            ref="${IMAGE_REF}@sha256:${digest}"
            source_args+=("${ref}")
            mapfile -t leg < <(
              docker buildx imagetools inspect --format '{{json .Image}}' \
                "${ref}" \
                | jq -r 'if has("os") then "\(.os)/\(.architecture)"
                         else keys[] end'
            )
            if [[ "${#leg[@]}" -ne 1 ]]; then
              echo "::error::${ref} advertises ${#leg[@]} platforms" \
                "(${leg[*]-none}). Each matrix leg must push exactly one," \
                "because the merge below names one digest per architecture."
              exit 1
            fi
            platforms+=("${leg[0]}")
          done
          echo "Digest platforms: ${platforms[*]}"

          absent="$(
            jq -rn --args \
              '["linux/amd64", "linux/arm64"] - $ARGS.positional | join(" ")' \
              "${platforms[@]}"
          )"
          if [[ -n "${absent}" ]]; then
            echo "::error::The digests for ${{ matrix.component }} cover" \
              "${platforms[*]} and do not include ${absent}. Refusing to" \
              "tag: a published single-architecture tag is the failure this" \
              "job exists to prevent."
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${source_args[@]}"

      # The pre-tag check above is what prevents a broken tag from being
      # published; this one confirms the artefact that actually exists, which
      # is the contract consumers pull against. Keeping both is deliberate:
      # the first covers bad inputs, the second covers a bad assembly.
      - name: Verify both architectures are in the published tag
        run: |
          set -euo pipefail
          manifest="$(
            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "${IMAGE_REF}:${RELEASE_TAG}"
          )"
          echo "${manifest}"

          # Read the platforms with jq rather than grepping the JSON: the OCI
          # descriptor marshals `architecture` before `os`, so any assertion
          # written against a field order is one upstream struct change away
          # from failing on a correct image.
          missing="$(
            jq -r '
              ["linux/amd64", "linux/arm64"]
              - [.manifests[]
                 | select(.platform.os != "unknown")
                 | "\(.platform.os)/\(.platform.architecture)"]
              | join(" ")
            ' <<<"${manifest}"
          )"
          if [[ -n "${missing}" ]]; then
            echo "::error::${IMAGE_REF}:${RELEASE_TAG} does not advertise" \
              "${missing}. A single-architecture tag is exactly the failure" \
              "this job exists to prevent: it pulls fine on the architecture" \
              "that built it and dies with 'exec format error' on the other."
            exit 1
          fi
          echo "Both linux/amd64 and linux/arm64 are present."
