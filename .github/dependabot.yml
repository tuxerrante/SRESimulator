---
version: 2
# Dependabot updates text-based bun.lock files through the dedicated `bun`
# ecosystem (GA 2025-02, Bun >= 1.1.39); the `npm` ecosystem does not update
# bun.lock. This repository keeps frontend/bun.lock and backend/bun.lock as the
# only dependency lockfiles.
updates:
  # The Dependabot E2E gate claims a namespace from a fixed-size pool, so PRs
  # beyond the pool size queue for a free slot (~20 minutes per run). Keep the
  # number of simultaneous PRs close to the pool size by batching non-major
  # updates, otherwise the ci-gate wait starves.
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
      frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: bun
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: vitest
        versions:
          - 4.1.4
      - dependency-name: "@vitest/coverage-v8"
        versions:
          - 4.1.4

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
