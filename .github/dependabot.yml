---
version: 2
updates:
  # The Dependabot E2E gate serialises on a single shared namespace, so every
  # extra open PR adds ~20 minutes to the queue and starves the ci-gate wait.
  # Keep the number of simultaneous PRs small by batching non-major updates.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: vitest
        versions:
          - 4.1.4
      - dependency-name: "@vitest/coverage-v8"
        versions:
          - 4.1.4

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
