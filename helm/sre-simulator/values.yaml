---
frontend:
  image:
    repository: ghcr.io/tuxerrante/sre-simulator-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3000
  service:
    # Default stays internal. AKS enables this block and binds the service to
    # the reserved Azure public IP.
    public:
      annotations: {}
      loadBalancerIP: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  sentry:
    enabled: false
    dsn: ""
    environment: production
    replaySessionSampleRate: "0"
    replayOnErrorSampleRate: "0"
  auth:
    # Existing Secret used by Next.js auth routes.
    existingSecretName: ""
    githubOAuthEnabled: true
    githubClientIdKey: github-client-id
    githubClientSecretKey: github-client-secret
    # Optional declaration bound to the OAuth credentials. Non-production
    # deploy helpers require it to match the public callback exactly.
    githubCallbackUrlKey: ""
    requireGithubCallbackMatch: false
    authSessionSecretKey: auth-session-secret
    # Optional keys in the same Secret for anonymous verification flows.
    antiAbuseHmacSecretKey: ""
    turnstileSiteKeyKey: ""
  trustProxyHeaders: false
  # Which forwarded header carries the edge-derived client address. Empty
  # means the app default, x-envoy-external-address, which is what the AKS
  # Envoy Gateway publishes -- leave it empty on that path.
  #
  # Set it only when a DIFFERENT Layer-7 proxy terminates the connection and
  # OVERWRITES the header for untrusted peers, which is the precondition that
  # makes a forwarded header non-forgeable (see gateway.clientIpDetection
  # below for why AKS cannot meet it). On k3s the bundled Traefik overwrites
  # X-Real-Ip and never sets the Envoy header, so the default matches nothing
  # there; behind Cloudflare the correct value is cf-connecting-ip.
  #
  # Never x-forwarded-for or forwarded. Both are list-valued and every proxy
  # in the chain appends to them, and the reader requires the whole value to
  # parse as a single IP -- so behind any appending proxy the knob does not
  # forge anything, it silently returns nothing and every anonymous request
  # 400s once requireAnonymousClientIp is on.
  #
  # An empty value renders no env var at all, so every existing deployment's
  # manifest is byte-identical to before this key existed.
  trustedClientIpHeader: ""
  adminAnalyticsEnabled: false
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

backend:
  image:
    repository: ghcr.io/tuxerrante/sre-simulator-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    # Memory scaling is disabled by default because Node.js has a high fixed
    # baseline memory footprint. Scaling down based on memory requires the
    # remaining pods to absorb the conserved total memory without exceeding
    # the target, which traps the HPA in a scaled-up state.
    # targetMemoryUtilizationPercentage: 75
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sentry:
    enabled: false
    dsn: ""
    environment: production
    release: ""
  trustProxyHeaders: false
  persistentLeaderboardEnabled: false
  allowDeployedJsonStorageForTests: false
  aiChatTimeoutMs: 30000
  aiCommandTimeoutMs: 12000
  aiScenarioTimeoutMs: 12000
  # End-to-end application deadline for POST /api/scenario, including failure
  # cleanup. The backend clamps this to 24000 ms so it always answers before
  # the 30s Envoy Gateway timeout on the same route.
  scenarioRequestBudgetMs: 24000
  rateLimit:
    windowMs: 60000
    max: 15
    redisUrl: ""
    redisUrlFromSecret:
      existingSecretName: ""
      key: redis-url
  auth:
    # Existing Secret used by backend auth/anonymous verification routes.
    existingSecretName: ""
    authSessionSecretKey: auth-session-secret
    antiAbuseHmacSecretKey: ""
    turnstileSecretKey: ""
    turnstileExpectedHostnameKey: ""
    turnstileTestMode: false
    localTestVerificationEnabled: false
    requireAnonymousClientIp: false
  podSecurityContext:
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

ai:
  provider: vertex
  mockMode: true
  strictStartup: true
  model: claude-sonnet-4@20250514
  liveProbeToken: ""
  vertex:
    region: us-east5
    projectId: ""
    credentials:
      existingSecretName: ""
      key: credentials.json
      mountPath: /var/run/secrets/gcp
  azureOpenai:
    endpoint: ""
    endpointFromSecret:
      existingSecretName: ""
      key: endpoint
    deployment: ""
    routeDeployments:
      chat: ""
      command: ""
      scenario: ""
      probe: ""
    # Reasoning-capable version for gpt-5.x (accepts reasoning_effort /
    # max_completion_tokens). Newest preview available on the ARO SRE tenant
    # (2025-05-01-preview and later return HTTP 404); validated with a live
    # chat/completions probe.
    apiVersion: 2025-04-01-preview
    credentials:
      existingSecretName: ""
      key: api-key
  # OpenRouter reaches the same OpenAI-compatible transport as azureOpenai, so
  # only the endpoint, the auth header and the model naming differ. Every field
  # here is empty by default and an empty field renders no environment variable
  # at all, which is what keeps the Azure and Vertex profiles byte-identical.
  openrouter:
    # Empty falls back to the backend's own DEFAULT_OPENROUTER_BASE_URL. Set it
    # only to pin a proxy or a pre-release endpoint.
    baseUrl: ""
    # Fallback model for any route that names none below.
    model: ""
    # Free slugs churn, so the split lives in configuration rather than code.
    # scenario and probe fall back to command, then to model, in the backend.
    routeModels:
      chat: ""
      command: ""
      scenario: ""
      probe: ""
    # Sent as HTTP-Referer / X-Title. OpenRouter shows them on the account's
    # public activity page, so they are attribution, not credentials.
    siteUrl: ""
    appTitle: ""
    credentials:
      existingSecretName: ""
      key: api-key

exposure:
  # route: OpenShift Route
  # ingress: Kubernetes Ingress
  # publicService: Kubernetes Service type LoadBalancer
  # gateway: Kubernetes Gateway API public edge
  # none: no public edge object
  # Leave empty to use legacy toggles (route.enabled / ingress.enabled).
  mode: ""
  host: sre-simulator.apps.example.com
  # Optional override. Defaults to https for Route and Gateway, ingress
  # when TLS is enabled, and http for a public Service.
  scheme: ""

route:
  enabled: true
  tls:
    termination: edge

# Escape hatch when the externally visible origin is not derivable from the
# chart-managed public edge.
publicOrigin: ""

ingress:
  enabled: false
  className: nginx
  path: /
  pathType: Prefix
  annotations: {}
  # Traefik-specific routing, used by the k3s/OCI profile. An empty
  # certResolver emits no Traefik annotations at all, so nginx and every other
  # ingress profile render exactly as before.
  traefik:
    certResolver: ""
    entryPoint: websecure
    # Traefik Middlewares for the OCI box, where the origin is a single 12 GB
    # VM with no cloud load balancer in front of it. Both default to false, so
    # no Middleware object is rendered and the Ingress grows no annotation:
    # every existing profile's render is unchanged.
    #
    # ipStrategy.depth stays 0 on purpose. Traefik then keys on the TCP remote
    # address, which hostNetwork Traefik sees unmasqueraded; reading a position
    # in X-Forwarded-For would let a caller choose which bucket to spend.
    rateLimit:
      enabled: false
      average: 30
      burst: 60
      period: 1m
    inFlightReq:
      enabled: false
      amount: 20
  tls:
    enabled: false
    secretName: ""

gateway:
  className: eg
  # Envoy Gateway defaults requests to 15s. Scenario creation needs enough
  # headroom for the backend's 12s AI fallback plus verification and storage.
  scenarioRequestTimeout: 30s
  tls:
    secretName: sre-simulator-gateway-tls
  certManager:
    clusterIssuer: letsencrypt-azuredns-prod
  envoyProxy:
    name: sre-simulator-public-edge
  clientIpDetection:
    enabled: true
    # Trust X-Forwarded-For only when a Layer-7 proxy that OVERWRITES the
    # header sits in front of the Gateway. The AKS path terminates on a
    # Layer-4 Azure Load Balancer that never sets X-Forwarded-For, so the
    # header is fully caller-controlled there: trusting it would let anyone
    # forge a client IP and mint unlimited anonymous trials. Leaving this
    # disabled makes Envoy derive the client IP from the connection source
    # address and publish it as x-envoy-external-address.
    trustXForwardedFor: false
    # Only used when trustXForwardedFor is true.
    numTrustedHops: 1

database:
  enabled: false
  # Full ADO.NET-style connection string stored in a K8s Secret.
  # Format: Server=<fqdn>;Database=sresimulator;User Id=sresimadmin;Password=<pwd>;Encrypt=true
  existingSecretName: ""
  secretConnectionStringKey: "connection-string"

storage:
  enabled: true
  # Empty means "use the cluster default storage class".
  storageClass: ""
  size: 1Gi

imagePullSecrets: []
