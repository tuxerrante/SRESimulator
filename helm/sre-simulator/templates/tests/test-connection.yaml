apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test" (include "sre-simulator.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "sre-simulator.labels" . | nindent 4 }}
    {{- include "sre-simulator.helmTest.selectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  initContainers:
    # Wait for this pod to become allowed to reach the backend before any
    # assertion runs.
    #
    # templates/networkpolicy.yaml restricts backend ingress to the frontend
    # and to this pod. Enforcement is the CNI's job, and on k3s that is the
    # bundled kube-router, which programs a newly created pod's IP into the
    # allowed-source ipset asynchronously. Nothing in Kubernetes orders pod
    # start after policy programming, so for roughly the first second the
    # backend rejects this pod outright and the first curl fails instantly
    # with "Failed to connect ... after 1 ms". Verified on k3d: without this
    # wait the first request fails on every single run, and the second one,
    # a second later, always succeeds.
    #
    # The wait lives here rather than as retry flags on the assertions below
    # so those assertions stay strict: an init container shares the pod's
    # network namespace and IP, so once it gets through, the policy is
    # programmed for the whole pod, and a single failed curl in the test body
    # is then a real failure rather than a startup artefact.
    #
    # Platforms that do not enforce NetworkPolicy (AKS by default, and kind in
    # helm-integration.yml) succeed on the first attempt and pay nothing.
    - name: wait-for-network-policy
      image: curlimages/curl:8.13.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          BACKEND="{{ include "sre-simulator.fullname" . }}-backend:{{ .Values.backend.port }}"
          # Bounded by wall clock, not by attempt count. A policy rejection
          # returns instantly, so 60 attempts is ~2 minutes; a blackholed
          # backend runs each curl to --max-time, so the same 60 attempts is
          # ~7 minutes -- past the `helm test --timeout 4m` its callers use
          # (helm-integration.yml:133, the free-e2e gate). Helm would kill the
          # hook before the diagnostic below ever printed, turning the one
          # failure this container exists to report into a bare timeout.
          # 90 seconds is ~45x the observed need and leaves the rest of the
          # budget for image pull and the assertions.
          DEADLINE_SECONDS=90
          started="$(date +%s)"
          attempt=0
          while [ "$(($(date +%s) - started))" -lt "${DEADLINE_SECONDS}" ]; do
            attempt=$((attempt + 1))
            if curl -fsS -o /dev/null --max-time 5 "http://${BACKEND}/healthz"; then
              echo "backend reachable after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became reachable from this pod within ${DEADLINE_SECONDS}s." >&2
          echo "If the backend itself is healthy, suspect NetworkPolicy:" >&2
          echo "  kubectl describe networkpolicy {{ include "sre-simulator.fullname" . }}-backend" >&2
          exit 1
  containers:
    - name: test
      image: curlimages/curl:8.13.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          BACKEND="{{ include "sre-simulator.fullname" . }}-backend:{{ .Values.backend.port }}"
          FRONTEND="{{ include "sre-simulator.fullname" . }}-frontend:{{ include "sre-simulator.frontendServicePort" . }}"

          echo "=== Backend health check ==="
          curl -fsS "http://${BACKEND}/healthz"
          echo ""

          echo "=== Backend readiness check ==="
          curl -fsS "http://${BACKEND}/readyz"
          echo ""

          echo "=== Frontend reachability ==="
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "http://${FRONTEND}/")
          echo "Frontend status: ${STATUS}"
          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 400 ]; then
            echo "FAIL: frontend returned ${STATUS}"
            exit 1
          fi

          echo "=== API guide endpoint ==="
          curl -fsS "http://${BACKEND}/api/guide" | head -c 100
          echo ""

          echo "=== API leaderboard ==="
          curl -fsS "http://${BACKEND}/api/scores" | head -c 200
          echo ""

          echo ""
          echo "All helm tests passed."
