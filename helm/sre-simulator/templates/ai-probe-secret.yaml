{{- $probeToken := .Values.ai.liveProbeToken | default "" | trim -}}
{{- if $probeToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-simulator.fullname" . }}-ai-probe
  labels:
    {{- include "sre-simulator.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $probeToken | quote }}
{{- end }}
