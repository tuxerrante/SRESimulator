---
ai:
  provider: azure-openai
  mockMode: false
  strictStartup: true
  # Align with the provisioned deployment default (infra/variables.tf
  # aoai_model_name / aoai_model_version). Override per environment as needed.
  model: gpt-5.6-terra
  azureOpenai:
    endpointFromSecret:
      existingSecretName: azure-openai-creds
      key: endpoint
    deployment: gpt-5.6-terra
    # Reasoning-capable version for gpt-5.x (accepts reasoning_effort /
    # max_completion_tokens). Newest preview available on the ARO SRE tenant
    # (2025-05+ return 404); validated with a live chat/completions probe.
    apiVersion: 2025-04-01-preview
    credentials:
      existingSecretName: azure-openai-creds
      key: api-key
